name: Publish seasonal Pages payload
description: Queue one source artifact behind the single-writer seasonal Pages publisher
inputs:
  source-workflow:
    description: Exact publish-pages source_workflow value
    required: true
  source-run-id:
    description: Completed producer run whose artifact should be published
    required: true
  ref:
    description: Branch from which publish-pages should run
    required: false
    default: main
  max-attempts:
    description: Number of attempts after a queue replacement or cancellation
    required: false
    default: "6"
  queue-timeout-seconds:
    description: Maximum time to wait for an existing Pages writer
    required: false
    default: "1800"
outputs:
  publish-run-id:
    description: Pages workflow run that completed the handoff
    value: ${{ steps.publish.outputs.publish-run-id }}
runs:
  using: composite
  steps:
    - id: publish
      name: Queue and watch shared Pages publisher
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        SOURCE_WORKFLOW: ${{ inputs.source-workflow }}
        SOURCE_RUN_ID: ${{ inputs.source-run-id }}
        PUBLISH_REF: ${{ inputs.ref }}
        MAX_ATTEMPTS: ${{ inputs.max-attempts }}
        QUEUE_TIMEOUT_SECONDS: ${{ inputs.queue-timeout-seconds }}
      run: |
        set -euo pipefail
        publisher_id=""
        for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
          queue_wait=0
          while gh run list --repo "$GH_REPO" --workflow publish-pages.yml --limit 100 --json status --jq 'any(.[]; .status != "completed")' | grep -qx true; do
            if (( queue_wait >= QUEUE_TIMEOUT_SECONDS )); then
              echo "::error::Pages publisher queue did not drain within ${QUEUE_TIMEOUT_SECONDS}s"
              exit 1
            fi
            sleep 15
            queue_wait=$((queue_wait + 15))
          done

          dispatch_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if ! gh workflow run publish-pages.yml --repo "$GH_REPO" --ref "$PUBLISH_REF" \
            -f source_workflow="$SOURCE_WORKFLOW" -f source_run_id="$SOURCE_RUN_ID"; then
            if (( attempt == MAX_ATTEMPTS )); then
              echo "::error::Unable to dispatch Pages publisher after ${MAX_ATTEMPTS} attempts"
              exit 1
            fi
            sleep $((attempt * 10))
            continue
          fi

          publisher_id=""
          for lookup in $(seq 1 30); do
            publisher_id="$(gh run list --repo "$GH_REPO" --workflow publish-pages.yml --event workflow_dispatch \
              --limit 100 --json databaseId,createdAt,displayTitle,event \
              --jq ".[] | select(.event == \"workflow_dispatch\" and .createdAt >= \"$dispatch_started\" and (.displayTitle | endswith(\" · $SOURCE_RUN_ID\"))) | .databaseId" | head -1)"
            if [[ -n "$publisher_id" ]]; then
              break
            fi
            sleep 5
          done
          if [[ -z "$publisher_id" ]]; then
            echo "::warning::Could not resolve the Pages publisher for source run $SOURCE_RUN_ID"
          else
            echo "Pages publisher run: $publisher_id"
            if gh run watch "$publisher_id" --repo "$GH_REPO" --exit-status --interval 15; then
              echo "publish-run-id=$publisher_id" >> "$GITHUB_OUTPUT"
              echo "- $SOURCE_WORKFLOW / $SOURCE_RUN_ID: https://github.com/$GH_REPO/actions/runs/$publisher_id" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            conclusion="$(gh run view "$publisher_id" --repo "$GH_REPO" --json conclusion --jq .conclusion 2>/dev/null || true)"
            if [[ "$conclusion" != "cancelled" && "$conclusion" != "timed_out" && "$conclusion" != "" ]]; then
              echo "::error::Pages publisher $publisher_id ended with $conclusion"
              exit 1
            fi
            echo "::warning::Pages publisher $publisher_id was $conclusion; retrying the handoff"
          fi
          if (( attempt == MAX_ATTEMPTS )); then
            echo "::error::Pages handoff was replaced or cancelled too many times"
            exit 1
          fi
          sleep $((attempt * 10))
        done
