name: Set up wgrib2
description: Restore or build the wgrib2 binary used by seasonal GRIB renderers.
inputs:
  required:
    description: Whether this job needs wgrib2.
    required: false
    default: "true"
  build:
    description: Whether to build the binary when the shared cache is cold.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Restore wgrib2 tool cache
      id: cache
      if: ${{ inputs.required == 'true' }}
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/wallcloud/wgrib2
        key: wgrib2-${{ runner.os }}-v1

    - name: Build wgrib2 from source when needed
      if: ${{ inputs.required == 'true' && inputs.build == 'true' && steps.cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y build-essential gfortran libopenjp2-7-dev libpng-dev zlib1g-dev
        source_dir="$RUNNER_TEMP/wgrib2-src"
        install_dir="$HOME/.cache/wallcloud/wgrib2"
        mkdir -p "$source_dir" "$install_dir"
        curl -fsSL "https://ftp.cpc.ncep.noaa.gov/wd51we/wgrib2/wgrib2.tgz" -o "$RUNNER_TEMP/wgrib2.tgz"
        tar -xzf "$RUNNER_TEMP/wgrib2.tgz" -C "$source_dir"
        makefile_dir="$source_dir/grib2"
        test -f "$makefile_dir/makefile"
        export CC=gcc
        export FC=gfortran
        make -C "$makefile_dir" -j"$(nproc)"
        wgrib2_bin="$makefile_dir/wgrib2/wgrib2"
        test -x "$wgrib2_bin"
        cp "$wgrib2_bin" "$install_dir/wgrib2"
        chmod +x "$install_dir/wgrib2"

    - name: Select wgrib2 tool
      if: ${{ inputs.required == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        test -x "$HOME/.cache/wallcloud/wgrib2/wgrib2"
        echo "CANSIPS_WGRIB2=$HOME/.cache/wallcloud/wgrib2/wgrib2" >> "$GITHUB_ENV"
        echo "CFSV2_WGRIB2=$HOME/.cache/wallcloud/wgrib2/wgrib2" >> "$GITHUB_ENV"

    - name: Save wgrib2 tool cache
      if: ${{ inputs.required == 'true' && inputs.build == 'true' && steps.cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        path: ~/.cache/wallcloud/wgrib2
        key: wgrib2-${{ runner.os }}-v1
