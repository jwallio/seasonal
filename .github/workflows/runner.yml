name: WeatherNext Runner

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_target:
        description: "[Run] Product or parameter preset"
        required: false
        default: "flagship"
        type: choice
        options:
          - flagship
          - all
          - snowfall
          - winter_weather
          - regional_zoom
          - conus_core
          - z500_anomalies
          - weather_parameters
          - surface_parameters
          - upper_air_parameters
          - temperature_parameters
          - temperature
          - ne_zoom_snow_accum
          - mi_wi_snow_accum
          - carolinas_snow_accum
          - conus_snow_accum
          - ne_snow_accum
          - conus_mslp_ptype
          - ne_mslp_ptype
          - conus_vort500
          - conus_t2m
          - conus_t2m_anom
          - conus_wind10
          - conus_t850
          - conus_t500
          - conus_omega500
          - conus_sst
          - nh_z500a
          - na_z500a
      run_length:
        description: "[Time] Latest frame or full range"
        required: false
        default: "full"
        type: choice
        options:
          - latest_frame
          - "24"
          - "48"
          - "72"
          - "120"
          - full
      graphics_profile:
        description: "[Graphics] Default graphics profile"
        required: false
        default: "rework"
        type: choice
        options:
          - rework
          - legacy
      z500_style:
        description: "[Graphics] 500-mb anomaly style"
        required: false
        default: "default"
        type: choice
        options:
          - default
          - classic
      ensemble_mode:
        description: "[Model] WeatherNext ensemble selection"
        required: false
        default: "first"
        type: choice
        options:
          - first
          - mean
          - median
          - member
      ensemble_member:
        description: "[Model] Ensemble member when mode=member"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  run-default:
    uses: ./.github/workflows/update.yml
    with:
      run_target: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_target || 'flagship' }}
      custom_products_csv: ""
      graphics_profile: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.graphics_profile || 'rework' }}
      z500_style: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.z500_style || 'default' }}
      ensemble_mode: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ensemble_mode || 'first' }}
      ensemble_member: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ensemble_member || '' }}
      preview_one_frame: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_length == 'latest_frame') }}
      hour_range_preset: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_length != 'latest_frame' && github.event.inputs.run_length || 'full' }}
      hours_csv: ""
      run_init_utc: ""
      max_dimension: "900"
      export_workers: "3"
      geography_detail: auto
      snow_ratio_csv: "10"
      climo_source: era5
      climo_start_year: "1991"
      climo_end_year: "2020"
      run_history_hours: "24"
    secrets: inherit
