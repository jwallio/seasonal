name: CFSv2 Snowfall Graphics
run-name: Corrected CFSv2 snowfall · automatic matched reference
on:
  workflow_call:
  push:
    branches: [main]
    paths: ['.github/workflows/cfsv2-snow.yml', 'scripts/cfsv2_surface_schedule.py', 'scripts/cfsv2_surface_phase_build.py', 'scripts/cfsv2_surface_phase.py']
  workflow_dispatch:
    inputs:
      product:
        description: Both snowfall totals and departures are always rebuilt together
        default: snowfall_suite
        type: string
      lead_months:
        description: Automatically selects December through March
        default: operational-winter
        type: string
      seasonal_window:
        description: Automatically includes DJF and JFM
        default: operational-winter
        type: string
permissions:
  contents: write
  actions: write
  pages: write
concurrency:
  # The availability dispatcher handles deduplication. Never cancel an active
  # multi-hour acquisition when the next NOAA poll fires.
  group: cfsv2-corrected-snowfall-acquisition
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      init: ${{ steps.plan.outputs.init }}
      targets: ${{ steps.plan.outputs.targets }}
      leads: ${{ steps.plan.outputs.leads }}
      windows: ${{ steps.plan.outputs.windows }}
      cycles: ${{ steps.plan.outputs.cycles }}
      excluded: ${{ steps.plan.outputs.excluded }}
      years: ${{ steps.plan.outputs.years }}
      cache_period: ${{ steps.plan.outputs.cache_period }}
      restore_run: ${{ steps.previous.outputs.run }}
      bootstrap: ${{ steps.previous.outputs.bootstrap }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/cfsv2-snow.yml
      - run: pip install numpy requests eccodes
      - id: plan
        run: python -u scripts/cfsv2_surface_schedule.py select
      - id: previous
        if: steps.plan.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cfsv2-snow.yml/runs?status=completed&per_page=20" > previous-runs.json
          python - <<'PY'
          import json,os,subprocess
          found=None
          bootstrap_run=None
          for run in json.load(open('previous-runs.json'))['workflow_runs']:
              if str(run['id'])==os.environ['GITHUB_RUN_ID'] or run.get('conclusion') != 'success':
                  continue
              result=subprocess.run(
                  ['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run['id']}/artifacts?per_page=100"],
                  check=True,capture_output=True,text=True,
              )
              artifacts=json.loads(result.stdout)['artifacts']
              names={a['name'] for a in artifacts if not a.get('expired')}
              # Reuse a complete successful run first. Failed runs can contain a
              # partial 2026 artifact and must never become the input source.
              if 'surface-phase-inputs-2026' in names:
                  found=run['id']
                  break
              if bootstrap_run is None and any(
                  name.startswith('surface-phase-2026090612-') for name in names
              ):
                  bootstrap_run=run['id']
          restore_run=found or bootstrap_run
          if restore_run is None:
              # The checked-in bootstrap is only accepted after its artifact is
              # verified, so an expired/deleted artifact fails with a clear error.
              fallback='34176070490'
              result=subprocess.run(
                  ['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{fallback}/artifacts?per_page=100"],
                  check=True,capture_output=True,text=True,
              )
              names={a['name'] for a in json.loads(result.stdout)['artifacts'] if not a.get('expired')}
              if any(name.startswith('surface-phase-2026090612-') for name in names):
                  restore_run=fallback
                  bootstrap_run=fallback
          if restore_run is None:
              raise SystemExit('No successful CFSv2 snowfall input artifact is available for reuse')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'run={restore_run}\nbootstrap={str(found is None).lower()}\n')
          PY
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.ready == 'true'
        with:
          compression-level: 0
          name: surface-phase-plan
          path: surface-plan.json
  acquire:
    needs: select
    if: needs.select.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 320
    strategy:
      fail-fast: false
      # Four year jobs overlap I/O and decoding while keeping each job's
      # worker pool bounded; this cuts cold-start time without unbounded load.
      max-parallel: 4
      matrix:
        year: ${{ fromJSON(needs.select.outputs.years) }}
    env:
      INIT: ${{ needs.select.outputs.init }}
      TARGETS: ${{ needs.select.outputs.targets }}
      EXCLUDED: ${{ needs.select.outputs.excluded }}
      YEAR: ${{ matrix.year }}
      CFSV2_LIVE_CYCLES: ${{ needs.select.outputs.cycles }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/cfsv2-snow.yml
      - run: pip install numpy requests eccodes
      - uses: actions/cache/restore@v4
        with:
          path: .cache/cfsv2-surface-phase
          key: phase-operational-v1-${{ needs.select.outputs.cache_period }}-${{ matrix.year }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: phase-operational-v1-${{ needs.select.outputs.cache_period }}-${{ matrix.year }}-
      - name: Restore reusable completed month bundles
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.select.outputs.restore_run }}
          name: ${{ needs.select.outputs.bootstrap == 'true' && format('surface-phase-2026090612-{0}', matrix.year == 2026 && 'forecast' || matrix.year) || format('surface-phase-inputs-{0}', matrix.year) }}
          path: restored-months
      - name: Merge checkpoints without replacing newer method bundles
        run: python scripts/cfsv2_restore_months.py restored-months .cache/cfsv2-surface-phase/months
      - name: Acquire and validate every required cycle-month
        run: |
          args=(--init "$INIT" --targets "$TARGETS" --rolling-days 6 --exclude-cycles "$EXCLUDED" --workers 4 --month-pause-seconds 0)
          if [[ "$YEAR" != "${INIT:0:4}" ]]; then args+=(--historical-year "$YEAR"); fi
          # Bound the Python process itself so a stalled NOAA request cannot
          # hold the acquisition concurrency group indefinitely.
          timeout --foreground --signal=TERM --kill-after=60s 270m \
            python -u scripts/cfsv2_surface_phase_build.py "${args[@]}"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/cfsv2-surface-phase
          key: phase-operational-v1-${{ needs.select.outputs.cache_period }}-${{ matrix.year }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          compression-level: 0
          name: surface-phase-inputs-${{ matrix.year }}
          path: .cache/cfsv2-surface-phase/months/
          if-no-files-found: warn
          retention-days: 90
  render:
    needs: [select, acquire]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      INIT: ${{ needs.select.outputs.init }}
      TARGETS: ${{ needs.select.outputs.targets }}
      EXCLUDED: ${{ needs.select.outputs.excluded }}
      LEADS: ${{ needs.select.outputs.leads }}
      WINDOWS: ${{ needs.select.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/cfsv2-snow.yml
      - run: pip install numpy requests eccodes matplotlib Pillow
      - uses: actions/download-artifact@v4
        with:
          pattern: surface-phase-inputs-*
          merge-multiple: true
          path: .cache/cfsv2-surface-phase/months
      - uses: actions/download-artifact@v4
        with:
          name: surface-phase-plan
          path: .
      - name: Assemble matching reference across all 15 years
        run: >-
          python scripts/cfsv2_surface_phase_build.py --reference
          --init "$INIT" --targets "$TARGETS" --rolling-days 6 --exclude-cycles "$EXCLUDED"
      - name: Render paired monthly and seasonal maps
        run: |
          for product in snowfall_accumulation snowfall_anomaly; do
            reference=()
            if [[ "$product" == snowfall_anomaly ]]; then reference=(--snowfall-reference-dir .cache/cfsv2-surface-phase/reference); fi
            python scripts/cfsv2_seasonal.py --product "$product" --init "$INIT" \
              --lead-months "$LEADS" --seasonal-window "$WINDOWS" --rolling-days 6 \
              --surface-phase-exclude-cycles "$EXCLUDED" \
              --surface-phase-bundle-dir .cache/cfsv2-surface-phase/months "${reference[@]}"
          done
          python scripts/cfsv2_surface_schedule.py verify --manifest public/seasonal/cfsv2_manifest.json
          mkdir -p payload/cfsv2
          cp -r "public/seasonal/cfsv2/$INIT" payload/cfsv2/
          cp public/seasonal/cfsv2_manifest.json surface-plan.json payload/
      - uses: actions/upload-artifact@v4
        with:
          compression-level: 0
          name: corrected-snowfall-ready
          path: payload/
      - uses: actions/upload-artifact@v4
        with:
          compression-level: 0
          name: matched-surface-phase-reference
          path: .cache/cfsv2-surface-phase/reference/
          retention-days: 90
  publish:
    needs: [select, render]
    if: needs.select.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout Pages handoff helper
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Queue corrected snowfall behind the shared Pages writer
        uses: ./.github/actions/publish-pages
        with:
          source-workflow: CFSv2 Snowfall Graphics
          source-run-id: ${{ github.run_id }}
