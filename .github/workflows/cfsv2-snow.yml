name: CFSv2 Snowfall Graphics

run-name: CFSv2 snowfall departure · leads ${{ inputs.lead_months }}

on:
  workflow_dispatch:
    inputs:
      lead_months:
        description: "CFS leads, or operational-winter for the next available Dec-Mar window"
        required: false
        default: "operational-winter"
        type: string
      seasonal_window:
        description: "Consecutive lead groups separated by semicolons, or operational-winter for DJF and JFM"
        required: false
        default: "operational-winter"
        type: string

permissions:
  contents: write

jobs:
  generate:
    name: Generate selected CFSv2 snow product
    uses: ./.github/workflows/cfsv2.yml
    with:
      product: snowfall_anomaly
      lead_months: ${{ inputs.lead_months }}
      seasonal_window: ${{ inputs.seasonal_window }}
      # GitHub-hosted jobs use the archive-safe operational window. Longer
      # windows require a rolling archive that predates the live NOMADS files.
      rolling_days: "6"
