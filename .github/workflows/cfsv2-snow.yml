name: CFSv2 Snowfall Graphics

run-name: CFSv2 snowfall departure · leads ${{ inputs.lead_months }}

on:
  workflow_dispatch:
    inputs:
      lead_months:
        description: "CFS lead numbers, not month positions (Sep init: 3,4,5,6 = Dec,Jan,Feb,Mar)"
        required: false
        default: "4,5,6"
        type: string
      seasonal_window:
        description: "CFS leads in the seasonal aggregate (Sep init: 3,4,5 = DJF)"
        required: false
        default: "4,5,6"
        type: string
      rolling_days:
        description: "Lagged initial-condition window; 6 means 24 cycles"
        required: false
        default: "6"
        type: string

permissions:
  contents: write

jobs:
  generate:
    name: Generate selected CFSv2 snow product
    uses: ./.github/workflows/cfsv2.yml
    with:
      product: snowfall_anomaly
      lead_months: ${{ inputs.lead_months }}
      seasonal_window: ${{ inputs.seasonal_window }}
      rolling_days: ${{ inputs.rolling_days }}
