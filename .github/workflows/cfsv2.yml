name: CFSv2 Rolling Seasonal Graphics

on:
  schedule:
    # CFSv2 runs every six hours. Run after the 06Z and 18Z cycles so the
    # newest listed cycle is normally available, and let the readiness probe
    # retry it before falling back to an older complete monthly-file set.
    - cron: "35 10,22 * * *"
  workflow_dispatch:
    inputs:
      product:
        description: "CFSv2 product to generate"
        required: false
        default: "500mb_height_anomaly"
        type: choice
        options:
          - 500mb_height_anomaly
          - 500mb_height_absolute
          - 2m_temperature_anomaly
          - mslp_anomaly
          - precipitation_anomaly
          - snow_water_equivalent_anomaly
      lead_months:
        description: "Target leads, comma-separated (DJF default: 4,5,6)"
        required: false
        default: "4,5,6"
        type: string
      seasonal_window:
        description: "Optional consecutive leads for a seasonal mean (DJF default: 4,5,6)"
        required: false
        default: "4,5,6"
        type: string
      rolling_days:
        description: "Lagged initial-condition window; 10 means 40 cycles"
        required: false
        default: "10"
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CFSV2_PRODUCT: ${{ inputs.product || '500mb_height_anomaly' }}
      SCHEDULED_CFSV2_PRODUCTS: 500mb_height_anomaly,2m_temperature_anomaly,mslp_anomaly,precipitation_anomaly
      LEAD_MONTHS: ${{ inputs.lead_months || '4,5,6' }}
      SEASONAL_WINDOW: ${{ inputs.seasonal_window || '4,5,6' }}
      ROLLING_DAYS: ${{ inputs.rolling_days || '10' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CFSv2 rendering dependencies
        run: python -m pip install --upgrade requests numpy matplotlib Pillow

      - name: Restore rolling state
        uses: actions/cache@v4
        with:
          path: .cache/cfsv2
          key: cfsv2-rolling-${{ github.run_id }}
          restore-keys: |
            cfsv2-rolling-

      - name: Restore published CFSv2 run history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/cfsv2
          published_manifest=".cache/cfsv2/previous_manifest.json"
          temporary_manifest="${published_manifest}.tmp"
          pages_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/seasonal/cfsv2_manifest.json"
          if curl -fsSL --retry 2 --connect-timeout 10 "$pages_url" -o "$temporary_manifest"; then
            mv "$temporary_manifest" "$published_manifest"
            echo "Restored prior CFSv2 manifest for current-plus-three retention per parameter."
          else
            rm -f "$temporary_manifest"
            if [ -f "$published_manifest" ]; then
              echo "Could not refresh CFSv2 manifest; retaining cached last-known-good history."
            else
              echo "No prior published CFSv2 manifest was available; starting a new history."
            fi
          fi

      - name: Build wgrib2
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran libopenjp2-7-dev libpng-dev zlib1g-dev
          source_dir="$RUNNER_TEMP/wgrib2-src"
          mkdir -p "$source_dir"
          curl -fsSL "https://ftp.cpc.ncep.noaa.gov/wd51we/wgrib2/wgrib2.tgz" -o "$RUNNER_TEMP/wgrib2.tgz"
          tar -xzf "$RUNNER_TEMP/wgrib2.tgz" -C "$source_dir"
          makefile_dir="$source_dir/grib2"
          test -f "$makefile_dir/makefile"
          export CC=gcc
          export FC=gfortran
          make -C "$makefile_dir" -j2
          wgrib2_bin="$makefile_dir/wgrib2/wgrib2"
          test -x "$wgrib2_bin"
          echo "CFSV2_WGRIB2=$wgrib2_bin" >> "$GITHUB_ENV"

      - name: Render rolling CFSv2 products
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            IFS=',' read -r -a products <<< "$SCHEDULED_CFSV2_PRODUCTS"
            readiness_products="$SCHEDULED_CFSV2_PRODUCTS"
          else
            products=("$CFSV2_PRODUCT")
            readiness_products="$CFSV2_PRODUCT"
          fi
          readiness_leads="${LEAD_MONTHS},${SEASONAL_WINDOW}"
          readiness_wait_minutes=0
          readiness_retry_seconds=60
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            readiness_wait_minutes=120
            readiness_retry_seconds=300
          fi
          anchor_init="$(
            python - "$readiness_products" "$readiness_leads" "$readiness_wait_minutes" "$readiness_retry_seconds" <<'PY'
          import sys

          sys.path.insert(0, "scripts")
          from cfsv2_seasonal import discover_latest_ready_init

          products = [value.strip() for value in sys.argv[1].split(",") if value.strip()]
          leads = sorted({int(value) for value in sys.argv[2].split(",") if value.strip()})
          print(
              discover_latest_ready_init(
                  products,
                  leads,
                  wait_for_latest_minutes=int(sys.argv[3]),
                  retry_seconds=int(sys.argv[4]),
              )
          )
          PY
          )"
          echo "Using CFSv2 anchor initialization $anchor_init for ${#products[@]} product(s)."
          for product in "${products[@]}"; do
            echo "Rendering CFSv2 product: $product"
            args=(
              scripts/cfsv2_seasonal.py
              --init "$anchor_init"
              --lead-months "$LEAD_MONTHS"
              --seasonal-window "$SEASONAL_WINDOW"
              --members 1
              --rolling-days "$ROLLING_DAYS"
              --rolling-member 1
              --rolling-state-dir .cache/cfsv2/rolling
              --cache-dir .cache/cfsv2
              --output-dir public/seasonal/cfsv2
              --manifest public/seasonal/cfsv2_manifest.json
              --previous-manifest .cache/cfsv2/previous_manifest.json
              --retain-runs 4
              --common-reference-dir .cache/cfsv2/common-reference
              --common-reference-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/seasonal/common_reference/1991-2020/"
              --request-delay 2
            )
            if [[ "$product" == "500mb_height_absolute" ]]; then
              args+=(--product "$product" --absolute)
            else
              args+=(--product "$product" --ncei-calibration --allow-stale-calibration)
            fi
            python "${args[@]}"
          done

      - name: Package CFSv2 Pages payload
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -d public/seasonal/cfsv2
          test -f public/seasonal/cfsv2_manifest.json
          rm -rf pages-payload
          mkdir -p pages-payload/cfsv2
          cp -R public/seasonal/cfsv2/. pages-payload/cfsv2/
          cp public/seasonal/cfsv2_manifest.json pages-payload/cfsv2_manifest.json

      - name: Upload CFSv2 Pages payload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cfsv2-pages-${{ github.run_id }}
          path: pages-payload
          if-no-files-found: error
          retention-days: 14

