name: CFSv2 Rolling Seasonal Graphics

on:
  schedule:
    # CFSv2 runs every six hours, while its monthly_grib_01 files normally
    # reach NOMADS about 11.5 hours after initialization. Check all four daily
    # cycles at +11:45, then let the readiness probe retry a delayed file set
    # before falling back to an older complete cycle.
    # The six-day rolling window stays inside NOMADS's seven-day archive even
    # when the selected anchor is delayed.
    - cron: "45 5,11,17,23 * * *"
  workflow_dispatch:
    inputs:
      product:
        description: "CFSv2 product to generate"
        required: false
        default: "500mb_height_anomaly"
        type: choice
        options:
          - all
          - 500mb_height_anomaly
          - 500mb_height_anomaly_nh
          - 500mb_height_absolute
          - 850mb_temperature_anomaly
          - 2m_temperature_anomaly
          - mslp_anomaly
          - precipitation_anomaly
          - snowfall_anomaly
          - snowfall_accumulation
          - snowfall_suite
      lead_months:
        description: "Target leads, comma-separated"
        required: false
        default: "4,5,6"
        type: string
      seasonal_window:
        description: "Optional consecutive leads for a seasonal aggregate"
        required: false
        default: "4,5,6"
        type: string
  workflow_call:
    inputs:
      product:
        description: "CFSv2 product to generate"
        required: true
        type: string
      lead_months:
        description: "Target leads, comma-separated"
        required: false
        default: "4,5,6"
        type: string
      seasonal_window:
        description: "Optional consecutive leads for a seasonal aggregate"
        required: false
        default: "4,5,6"
        type: string
      rolling_days:
        description: "Lagged initial-condition window"
        required: false
        default: "6"
        type: string

permissions:
  contents: write

concurrency:
  # Supersede only an older run from the same entry point and product scope.
  # A focused snowfall repair must never cancel the scheduled all-field suite.
  group: seasonal-cfsv2-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'scheduled-suite' || (inputs.product || 'default') }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CFSV2_PRODUCT: ${{ inputs.product || '500mb_height_anomaly' }}
      SCHEDULED_CFSV2_PRODUCTS: 500mb_height_anomaly,500mb_height_anomaly_nh,850mb_temperature_anomaly,2m_temperature_anomaly,mslp_anomaly,precipitation_anomaly,snowfall_anomaly,snowfall_accumulation
      ALL_CFSV2_PRODUCTS: 500mb_height_anomaly,500mb_height_anomaly_nh,500mb_height_absolute,850mb_temperature_anomaly,2m_temperature_anomaly,mslp_anomaly,precipitation_anomaly,snowfall_anomaly,snowfall_accumulation
      LEAD_MONTHS: ${{ inputs.lead_months || '4,5,6' }}
      SEASONAL_WINDOW: ${{ inputs.seasonal_window || '4,5,6' }}
      ROLLING_DAYS: ${{ inputs.rolling_days || '6' }}
      CFSV2_MINIMUM_ANCHOR_AGE_MINUTES: "660"
    steps:
      - name: Validate archive-safe rolling window
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$ROLLING_DAYS" =~ ^[1-6]$ ]]; then
            echo "::error title=Unsupported CFSv2 rolling window::GitHub-hosted jobs support 1-6 days (up to 24 cycles). Use 6 for operational maps; longer windows require a pre-populated external rolling archive."
            exit 2
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CFSv2 rendering dependencies
        run: python -m pip install --upgrade requests numpy matplotlib Pillow

      - name: Restore rolling state
        uses: actions/cache/restore@v4
        with:
          path: .cache/cfsv2
          key: cfsv2-rolling-${{ github.run_id }}
          restore-keys: |
            cfsv2-rolling-

      - name: Restore published CFSv2 run history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/cfsv2
          published_manifest=".cache/cfsv2/previous_manifest.json"
          temporary_manifest="${published_manifest}.tmp"
          pages_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/cfsv2_manifest.json"
          if curl -fsSL --retry 2 --connect-timeout 10 "$pages_url" -o "$temporary_manifest"; then
            mv "$temporary_manifest" "$published_manifest"
            echo "Restored prior CFSv2 manifest for current-plus-three retention per parameter."
          else
            rm -f "$temporary_manifest"
            if [ -f "$published_manifest" ]; then
              echo "Could not refresh CFSv2 manifest; retaining cached last-known-good history."
            else
              echo "No prior published CFSv2 manifest was available; starting a new history."
            fi
          fi

      - name: Set up wgrib2
        uses: ./.github/actions/setup-wgrib2

      - name: Render rolling CFSv2 products
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            IFS=',' read -r -a products <<< "$SCHEDULED_CFSV2_PRODUCTS"
            readiness_products="$SCHEDULED_CFSV2_PRODUCTS"
          elif [[ "$CFSV2_PRODUCT" == "all" ]]; then
            IFS=',' read -r -a products <<< "$ALL_CFSV2_PRODUCTS"
            readiness_products="$ALL_CFSV2_PRODUCTS"
          elif [[ "$CFSV2_PRODUCT" == "snowfall_suite" ]]; then
            products=("snowfall_anomaly" "snowfall_accumulation")
            readiness_products="snowfall_anomaly,snowfall_accumulation"
          else
            products=("$CFSV2_PRODUCT")
            readiness_products="$CFSV2_PRODUCT"
          fi
          readiness_wait_minutes=0
          readiness_retry_seconds=60
          minimum_anchor_age_minutes=0
          use_default_snowfall_windows=0
          if [[ "${{ github.event_name }}" == "schedule" || "$CFSV2_PRODUCT" == "all" ]]; then
            use_default_snowfall_windows=1
          elif [[ ( "$CFSV2_PRODUCT" == "snowfall_anomaly" || "$CFSV2_PRODUCT" == "snowfall_accumulation" || "$CFSV2_PRODUCT" == "snowfall_suite" ) && ( "$LEAD_MONTHS" == "operational-winter" || "$SEASONAL_WINDOW" == "operational-winter" ) ]]; then
            use_default_snowfall_windows=1
          fi
          if [[ "${{ github.event_name }}" == "schedule" || "$CFSV2_PRODUCT" == "all" ]]; then
            readiness_wait_minutes=30
            readiness_retry_seconds=180
            minimum_anchor_age_minutes="$CFSV2_MINIMUM_ANCHOR_AGE_MINUTES"
          fi
          anchor_init="$(
            python - "$readiness_products" "$LEAD_MONTHS" "$SEASONAL_WINDOW" "$readiness_wait_minutes" "$readiness_retry_seconds" "$minimum_anchor_age_minutes" "$use_default_snowfall_windows" <<'PY'
          import sys

          sys.path.insert(0, "scripts")
          from cfsv2_seasonal import (
              CFSv2Error,
              default_winter_snowfall_windows,
              discover_latest_ready_init,
              filter_mature_cycle_inits,
              listed_cycle_inits,
              parse_int_list,
              parse_seasonal_windows,
          )

          products = [value.strip() for value in sys.argv[1].split(",") if value.strip()]
          candidate_inits = filter_mature_cycle_inits(
              listed_cycle_inits(),
              minimum_age_minutes=int(sys.argv[6]),
          )
          leads = set()
          if sys.argv[2] != "operational-winter":
              leads.update(parse_int_list(sys.argv[2], "lead months", 1, 9))
          if sys.argv[3] != "operational-winter":
              for window in parse_seasonal_windows(sys.argv[3]):
                  leads.update(window)
          if sys.argv[7] == "1" and any(
              product in {"snowfall_anomaly", "snowfall_accumulation"}
              for product in products
          ):
              try:
                  snowfall_leads, _windows = default_winter_snowfall_windows(candidate_inits[0])
                  leads.update(snowfall_leads)
              except (CFSv2Error, IndexError) as exc:
                  if set(products).issubset({"snowfall_anomaly", "snowfall_accumulation"}):
                      raise
                  print(f"CFSv2 snowfall readiness skipped: {exc}", file=sys.stderr)
          print(
              discover_latest_ready_init(
                  products,
                  sorted(leads),
                  candidate_inits=candidate_inits,
                  wait_for_latest_minutes=int(sys.argv[4]),
                  retry_seconds=int(sys.argv[5]),
              )
          )
          PY
          )"
          echo "Using CFSv2 anchor initialization $anchor_init for ${#products[@]} product(s)."
          snowfall_lead_months=""
          snowfall_seasonal_windows=""
          if [[ "$use_default_snowfall_windows" == "1" ]]; then
            snowfall_config="$(
              python - "$anchor_init" <<'PY'
          import sys

          sys.path.insert(0, "scripts")
          from cfsv2_seasonal import CFSv2Error, default_winter_snowfall_windows

          try:
              leads, windows = default_winter_snowfall_windows(sys.argv[1])
          except CFSv2Error as exc:
              print(f"::warning title=CFSv2 snowfall window unavailable::{exc}", file=sys.stderr)
              print("|")
          else:
              lead_text = ",".join(str(lead) for lead in leads)
              window_text = ";".join(",".join(str(lead) for lead in window) for window in windows)
              print(f"{lead_text}|{window_text}")
          PY
            )"
            IFS='|' read -r snowfall_lead_months snowfall_seasonal_windows <<< "$snowfall_config"
          fi
          overall_status=0
          for product in "${products[@]}"; do
            echo "Rendering CFSv2 product: $product"
            product_lead_months="$LEAD_MONTHS"
            product_seasonal_window="$SEASONAL_WINDOW"
            if [[ ( "$product" == "snowfall_anomaly" || "$product" == "snowfall_accumulation" ) && "$use_default_snowfall_windows" == "1" ]]; then
              if [[ -z "$snowfall_lead_months" || -z "$snowfall_seasonal_windows" ]]; then
                if [[ "${{ github.event_name }}" == "schedule" || "$CFSV2_PRODUCT" == "all" ]]; then
                  echo "CFSv2 snowfall is outside the complete December-March forecast horizon; retaining the last published snowfall run."
                  continue
                fi
                echo "CFSv2 snowfall default window is unavailable for $anchor_init." >&2
                overall_status=1
                continue
              fi
              product_lead_months="$snowfall_lead_months"
              product_seasonal_window="$snowfall_seasonal_windows"
              echo "Using snowfall leads $product_lead_months with seasonal windows $product_seasonal_window."
            fi
            args=(
              scripts/cfsv2_seasonal.py
              --init "$anchor_init"
              --lead-months "$product_lead_months"
              --seasonal-window "$product_seasonal_window"
              --members 1
              --rolling-days "$ROLLING_DAYS"
              --rolling-member 1
              --rolling-state-dir .cache/cfsv2/rolling
              --cache-dir .cache/cfsv2
              --output-dir public/seasonal/cfsv2
              --manifest public/seasonal/cfsv2_manifest.json
              --previous-manifest .cache/cfsv2/previous_manifest.json
              --retain-runs 4
              --common-reference-dir .cache/cfsv2/common-reference
              --common-reference-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/common_reference/1991-2020/"
              --request-delay 2
              --keep-source-cache
            )
            if [[ "$product" == "500mb_height_absolute" ]]; then
              args+=(--product "$product" --absolute)
            elif [[ "$product" == "snowfall_accumulation" ]]; then
              args+=(--product "$product")
            else
              args+=(--product "$product" --ncei-calibration --allow-stale-calibration)
            fi
            if ! python "${args[@]}"; then
              echo "CFSv2 product failed: $product" >&2
              overall_status=1
            fi
          done
          exit "$overall_status"

      - name: Trim transient CFSv2 source cache
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d .cache/cfsv2 ]]; then
            find .cache/cfsv2 -mindepth 1 -maxdepth 1 -type d -regextype posix-extended -regex '.*/[0-9]{10}' -prune -exec rm -rf -- {} +
          fi

      - name: Save rolling state after every attempt
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/cfsv2
          key: cfsv2-rolling-${{ github.run_id }}

      - name: Package CFSv2 Pages payload
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -d public/seasonal/cfsv2
          test -f public/seasonal/cfsv2_manifest.json
          rm -rf pages-payload
          mkdir -p pages-payload/cfsv2
          cp -R public/seasonal/cfsv2/. pages-payload/cfsv2/
          cp public/seasonal/cfsv2_manifest.json pages-payload/cfsv2_manifest.json

      - name: Upload CFSv2 Pages payload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cfsv2-pages-${{ github.run_id }}
          path: pages-payload
          if-no-files-found: error
          retention-days: 14

