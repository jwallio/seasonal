name: Seasonal 500-mb Pattern Analogs

on:
  workflow_run:
    workflows:
      - CFSv2 Rolling Seasonal Graphics
      - Deduplicated Seasonal Super Ensemble
    types:
      - completed
  schedule:
    # Reconcile late Pages/source publication after the twice-daily CFSv2
    # windows. The freshness gate below avoids rebuilding unchanged maps.
    - cron: "35 2,14 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: seasonal-analogs
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, windows, x64, wn2-analogwx]
    timeout-minutes: 120
    env:
      ANALOGWX_DATA_ROOT: ${{ vars.ANALOGWX_DATA_ROOT }}
      ANALOGWX_PYTHON: ${{ vars.ANALOGWX_PYTHON }}
      SOURCE_WORKFLOW: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name || '' }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
    steps:
      - name: Checkout analog builder
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 1

      - name: Checkout current Pages tree
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1

      - name: Resolve seasonal Pages root
        shell: powershell
        run: |
          $flatManifest = (Test-Path -LiteralPath 'site\cfsv2_manifest.json') -or (Test-Path -LiteralPath 'site\superensemble_manifest.json')
          $nestedManifest = (Test-Path -LiteralPath 'site\seasonal\cfsv2_manifest.json') -or (Test-Path -LiteralPath 'site\seasonal\superensemble_manifest.json')
          $seasonalRoot = if ($flatManifest) { 'site' } elseif ($nestedManifest) { 'site\seasonal' } else { 'site' }
          "SEASONAL_SITE_ROOT=$seasonalRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Seasonal Pages root: $seasonalRoot"

      - name: Download fresh CFSv2 payload
        if: ${{ env.SOURCE_WORKFLOW == 'CFSv2 Rolling Seasonal Graphics' }}
        uses: actions/download-artifact@v4
        with:
          name: cfsv2-pages-${{ env.SOURCE_RUN_ID }}
          path: incoming/cfsv2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download fresh Super Ensemble payload
        if: ${{ env.SOURCE_WORKFLOW == 'Deduplicated Seasonal Super Ensemble' }}
        uses: actions/download-artifact@v4
        with:
          name: superensemble-pages-${{ env.SOURCE_RUN_ID }}
          path: incoming/superensemble
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Overlay fresh source payload
        if: ${{ env.SOURCE_WORKFLOW != '' }}
        shell: powershell
        run: |
          $source = $env:SOURCE_WORKFLOW
          if ($source -eq 'CFSv2 Rolling Seasonal Graphics') {
            $payload = Join-Path $PWD 'incoming\cfsv2'
            if (Test-Path (Join-Path $payload 'pages-payload')) { $payload = Join-Path $payload 'pages-payload' }
            if (Test-Path (Join-Path $payload '.pages-payload')) { $payload = Join-Path $payload '.pages-payload' }
            $manifest = Join-Path $payload 'cfsv2_manifest.json'
            $modelDir = Join-Path $payload 'cfsv2'
            if (-not (Test-Path -LiteralPath $manifest) -or -not (Test-Path -LiteralPath $modelDir)) { throw "Fresh CFSv2 payload is incomplete: $payload" }
            $seasonalRoot = $env:SEASONAL_SITE_ROOT
            New-Item -ItemType Directory -Force -Path (Join-Path $seasonalRoot 'cfsv2') | Out-Null
            Copy-Item -LiteralPath $manifest -Destination (Join-Path $seasonalRoot 'cfsv2_manifest.json') -Force
            Copy-Item -Path (Join-Path $modelDir '*') -Destination (Join-Path $seasonalRoot 'cfsv2') -Recurse -Force
          } elseif ($source -eq 'Deduplicated Seasonal Super Ensemble') {
            $payload = Join-Path $PWD 'incoming\superensemble'
            if (Test-Path (Join-Path $payload 'pages-payload')) { $payload = Join-Path $payload 'pages-payload' }
            if (Test-Path (Join-Path $payload '.pages-payload')) { $payload = Join-Path $payload '.pages-payload' }
            $manifest = Join-Path $payload 'superensemble_manifest.json'
            $modelDir = Join-Path $payload 'superensemble'
            if (-not (Test-Path -LiteralPath $manifest) -or -not (Test-Path -LiteralPath $modelDir)) { throw "Fresh Super Ensemble payload is incomplete: $payload" }
            $seasonalRoot = $env:SEASONAL_SITE_ROOT
            New-Item -ItemType Directory -Force -Path (Join-Path $seasonalRoot 'superensemble') | Out-Null
            Copy-Item -LiteralPath $manifest -Destination (Join-Path $seasonalRoot 'superensemble_manifest.json') -Force
            Copy-Item -Path (Join-Path $modelDir '*') -Destination (Join-Path $seasonalRoot 'superensemble') -Recurse -Force
          } else {
            throw "Unsupported source workflow: $source"
          }

      - name: Check scheduled source freshness
        id: freshness
        if: ${{ github.event_name == 'schedule' }}
        shell: powershell
        run: |
          $usableStatuses = @('rendered', 'partial', 'decoded')
          $needsBuild = $false
          $reasons = @()
          $seasonalRoot = $env:SEASONAL_SITE_ROOT
          $analogPath = Join-Path $seasonalRoot 'analog_z500_manifest.json'
          $analog = $null

          if (-not (Test-Path -LiteralPath $analogPath)) {
            $needsBuild = $true
            $reasons += 'analog manifest is missing'
          } else {
            try {
              $analog = Get-Content -LiteralPath $analogPath -Raw | ConvertFrom-Json
            } catch {
              $needsBuild = $true
              $reasons += "analog manifest could not be read: $($_.Exception.Message)"
            }
          }

          $sources = @(
            @{ key = 'cfsv2'; path = (Join-Path $seasonalRoot 'cfsv2_manifest.json') },
            @{ key = 'superensemble'; path = (Join-Path $seasonalRoot 'superensemble_manifest.json') }
          )
          foreach ($sourceSpec in $sources) {
            if (-not (Test-Path -LiteralPath $sourceSpec.path)) {
              $reasons += "$($sourceSpec.key) source manifest is unavailable; retaining its current analog"
              continue
            }
            try {
              $source = Get-Content -LiteralPath $sourceSpec.path -Raw | ConvertFrom-Json
            } catch {
              $reasons += "$($sourceSpec.key) source manifest could not be read; retaining its current analog"
              continue
            }
            $sourceRuns = @($source.runs | Where-Object { $usableStatuses -contains [string]$_.status })
            if ($sourceRuns.Count -eq 0) { continue }
            $sourceLatest = $sourceRuns |
              Sort-Object -Property `
                @{ Expression = { [string]$_.init_utc }; Descending = $true }, `
                @{ Expression = { [string]$_.generated_utc }; Descending = $true }, `
                @{ Expression = { [string]$_.id }; Descending = $true } |
              Select-Object -First 1
            $analogEntries = @()
            if ($null -ne $analog) {
              $analogEntries = @($analog.entries | Where-Object { [string]$_.model -eq $sourceSpec.key })
            }
            if ($analogEntries.Count -eq 0) {
              $needsBuild = $true
              $reasons += "$($sourceSpec.key) has no analog entry"
              continue
            }
            $analogLatest = $analogEntries |
              Sort-Object -Property `
                @{ Expression = { [string]$_.init_utc }; Descending = $true }, `
                @{ Expression = { [string]$_.run_id }; Descending = $true } |
              Select-Object -First 1
            $sourceInit = [string]$sourceLatest.init_utc
            $analogInit = [string]$analogLatest.init_utc
            $sourceRunId = [string]$sourceLatest.id
            $analogRunId = [string]$analogLatest.run_id
            if ($sourceInit -gt $analogInit -or ($sourceInit -eq $analogInit -and $sourceRunId -ne $analogRunId)) {
              $needsBuild = $true
              $reasons += "$($sourceSpec.key) source advanced to $sourceInit ($sourceRunId)"
            }
          }

          $value = if ($needsBuild) { 'true' } else { 'false' }
          "needs_build=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($reasons.Count -eq 0) { $reasons = @('all source analogs are current') }
          Write-Host "Scheduled analog reconciliation: needs_build=$value; $($reasons -join '; ')"

      - name: Build analog manifest from the local AnalogWX archive
        if: ${{ github.event_name != 'schedule' || steps.freshness.outputs.needs_build == 'true' }}
        shell: powershell
        run: |
          $dataRoot = $env:ANALOGWX_DATA_ROOT
          if ([string]::IsNullOrWhiteSpace($dataRoot)) { $dataRoot = 'D:\analogwx\data' }
          $archive = Join-Path $dataRoot 'era5_proc\z500_anom.zarr'
          if (-not (Test-Path -LiteralPath (Join-Path $archive 'zarr.json'))) { throw "AnalogWX Zarr archive not found: $archive. Set the ANALOGWX_DATA_ROOT repository variable." }

          $python = $env:ANALOGWX_PYTHON
          if ([string]::IsNullOrWhiteSpace($python)) {
            $candidates = @('C:\Users\jlwal\miniconda3\python.exe', 'D:\analogwx\.venv\Scripts\python.exe')
            $python = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if ([string]::IsNullOrWhiteSpace($python)) {
            $python = (Get-Command python -ErrorAction Stop).Source
          }
          & $python -c "import numpy, xarray, zarr, dask, scipy"
          if ($LASTEXITCODE -ne 0) {
            & $python -m pip install --disable-pip-version-check --quiet numpy xarray zarr dask scipy
            if ($LASTEXITCODE -ne 0) { throw 'Could not install the AnalogWX archive reader dependencies.' }
          }
          $seasonalRoot = $env:SEASONAL_SITE_ROOT
          $relativeRoot = if ($seasonalRoot -eq 'site') { '' } else { 'seasonal' }
          $analogRelative = if ($relativeRoot) { Join-Path $relativeRoot 'analog_z500_manifest.json' } else { 'analog_z500_manifest.json' }
          $productsRelative = if ($relativeRoot) { Join-Path $relativeRoot 'analog_products_manifest.json' } else { 'analog_products_manifest.json' }
          $productsRelativeDir = if ($relativeRoot) { Join-Path $relativeRoot 'analog_products' } else { 'analog_products' }
          $analogManifest = Join-Path 'site' $analogRelative
          $productsManifest = Join-Path 'site' $productsRelative
          $productsDir = Join-Path 'site' $productsRelativeDir
          & $python source\scripts\build_seasonal_analogs.py `
            --root site `
            --archive $archive `
            --models cfsv2,superensemble `
            --top-n 10 `
            --output $analogRelative
          if ($LASTEXITCODE -ne 0) { throw 'Analog manifest generation failed; the previous Pages artifact will be retained.' }
          if (-not (Test-Path -LiteralPath $analogManifest)) { throw 'Analog manifest was not written.' }

          & $python source\scripts\build_analog_products.py `
            --root site `
            --analog-manifest $analogRelative `
            --output $productsRelative `
            --output-dir $productsRelativeDir
          if ($LASTEXITCODE -ne 0) { throw 'Analog product manifest generation failed; the previous Pages artifact will be retained.' }
          if (-not (Test-Path -LiteralPath $productsManifest)) { throw 'Analog product manifest was not written.' }

      - name: Package analog Pages payload
        shell: powershell
        run: |
          $seasonalRoot = $env:SEASONAL_SITE_ROOT
          $analogManifest = Join-Path $seasonalRoot 'analog_z500_manifest.json'
          $productsManifest = Join-Path $seasonalRoot 'analog_products_manifest.json'
          $productsDir = Join-Path $seasonalRoot 'analog_products'
          if (-not (Test-Path -LiteralPath $analogManifest)) { throw 'Analog manifest is missing.' }
          if (-not (Test-Path -LiteralPath $productsManifest)) { throw 'Analog product manifest is missing.' }
          if (-not (Test-Path -LiteralPath $productsDir)) { throw 'Analog product directory is missing.' }
          if ($seasonalRoot -eq 'site') {
            $payloadRoot = 'pages-payload'
            $payloadProducts = 'pages-payload\analog_products'
          } else {
            $payloadRoot = 'pages-payload\seasonal'
            $payloadProducts = 'pages-payload\seasonal\analog_products'
          }
          New-Item -ItemType Directory -Force -Path $payloadRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $payloadProducts | Out-Null
          Copy-Item -LiteralPath $analogManifest -Destination (Join-Path $payloadRoot 'analog_z500_manifest.json') -Force
          Copy-Item -LiteralPath $productsManifest -Destination (Join-Path $payloadRoot 'analog_products_manifest.json') -Force
          Copy-Item -Path (Join-Path $productsDir '*') -Destination $payloadProducts -Recurse -Force

      - name: Upload analog Pages payload
        uses: actions/upload-artifact@v4
        with:
          name: analog-pages-${{ github.run_id }}
          path: pages-payload
          if-no-files-found: error
          retention-days: 14

