name: CFSv2 Surface Phase Reference Backfill
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: [".github/workflows/cfsv2-surface-phase-backfill.yml"]
  workflow_dispatch:
    inputs:
      init:
        description: Forecast initialization YYYYMMDDHH
        required: true
        default: '2026090612'
      targets:
        description: Comma-separated target months YYYYMM
        required: true
        default: '202612,202701,202702,202703'
      historical_year:
        description: Historical initialization year (2011–2025); blank builds forecast
        required: false
        default: ''
      exclude_cycles:
        description: Forecast initialization timestamps to exclude on both sides
        required: false
        default: ""
      rolling_days:
        description: Rolling window in days (1–6)
        required: true
        default: '6'
permissions:
  contents: read
concurrency:
  group: surface-phase-${{ inputs.init || '2026090612' }}-${{ github.event_name == 'pull_request' && '2019' || inputs.historical_year }}-${{ inputs.targets || '202612,202701,202702,202703' }}-${{ inputs.rolling_days || '6' }}
  cancel-in-progress: false
jobs:
  backfill:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/cfsv2-surface-phase'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      INIT: ${{ inputs.init || '2026090612' }}
      TARGETS: ${{ inputs.targets || '202612,202701,202702,202703' }}
      HISTORICAL_YEAR: ${{ github.event_name == 'pull_request' && '2019' || inputs.historical_year }}
      EXCLUDE_CYCLES: ${{ github.event_name == 'pull_request' && '2026083118,2026090418' || inputs.exclude_cycles }}
      ROLLING_DAYS: ${{ inputs.rolling_days || '6' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install decoding dependencies
        run: python -m pip install numpy requests eccodes
      - name: Normalize cache month key
        id: cache-months
        shell: bash
        run: |
          python - <<'PY'
          import os,re
          targets=os.environ["TARGETS"]
          if not re.fullmatch(r"[0-9]{6}(,[0-9]{6})*", targets):
              raise SystemExit("Expected comma-separated YYYYMM targets")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("key=" + targets.replace(",", "-") + "\n")
          PY
      - name: Restore validated and partial inputs
        uses: actions/cache/restore@v4
        with:
          path: .cache/cfsv2-surface-phase
          key: surface-phase-v1-${{ inputs.init || '2026090612' }}-${{ github.event_name == 'pull_request' && '2019' || inputs.historical_year }}-${{ steps.cache-months.outputs.key }}-${{ inputs.rolling_days || '6' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            surface-phase-v1-${{ inputs.init || '2026090612' }}-${{ github.event_name == 'pull_request' && '2019' || inputs.historical_year }}-${{ steps.cache-months.outputs.key }}-${{ inputs.rolling_days || '6' }}-
            surface-phase-v1-${{ inputs.init || '2026090612' }}-${{ github.event_name == 'pull_request' && '2019' || inputs.historical_year }}-
      - name: Build resumable month bundles
        shell: bash
        run: |
          args=(--exclude-cycles "$EXCLUDE_CYCLES" --init "$INIT" --targets "$TARGETS" --rolling-days "$ROLLING_DAYS" --workers 2 --month-pause-seconds 0)
          if [[ -n "$HISTORICAL_YEAR" ]]; then
            args+=(--historical-year "$HISTORICAL_YEAR")
          fi
          timeout --signal=INT --kill-after=30s 300m python -u scripts/cfsv2_surface_phase_build.py "${args[@]}"
      - name: Save checkpoints even after an unsuccessful build
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/cfsv2-surface-phase
          key: surface-phase-v1-${{ inputs.init || '2026090612' }}-${{ github.event_name == 'pull_request' && '2019' || inputs.historical_year }}-${{ steps.cache-months.outputs.key }}-${{ inputs.rolling_days || '6' }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Export completed bundles for reference assembly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-phase-${{ inputs.init || '2026090612' }}-${{ github.event_name == 'pull_request' && '2019' || inputs.historical_year || 'forecast' }}
          path: .cache/cfsv2-surface-phase/months/
          if-no-files-found: warn
          retention-days: 30
