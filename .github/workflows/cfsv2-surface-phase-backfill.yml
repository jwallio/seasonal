name: CFSv2 Surface Phase Reference Backfill
on:
  workflow_dispatch:
    inputs:
      init:
        description: Forecast initialization YYYYMMDDHH
        required: true
        default: '2026090612'
      targets:
        description: Comma-separated target months YYYYMM
        required: true
        default: '202612,202701,202702,202703'
      historical_year:
        description: Historical initialization year (2011–2025); blank builds forecast
        required: false
        default: ''
      rolling_days:
        description: Rolling window in days (1–6)
        required: true
        default: '6'
permissions:
  contents: read
concurrency:
  group: surface-phase-${{ inputs.init }}-${{ inputs.historical_year }}-${{ inputs.targets }}-${{ inputs.rolling_days }}
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      INIT: ${{ inputs.init }}
      TARGETS: ${{ inputs.targets }}
      HISTORICAL_YEAR: ${{ inputs.historical_year }}
      ROLLING_DAYS: ${{ inputs.rolling_days }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install decoding dependencies
        run: python -m pip install numpy requests eccodes
      - name: Restore validated and partial inputs
        uses: actions/cache/restore@v4
        with:
          path: .cache/cfsv2-surface-phase
          key: surface-phase-v1-${{ inputs.init }}-${{ inputs.historical_year }}-${{ inputs.targets }}-${{ inputs.rolling_days }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            surface-phase-v1-${{ inputs.init }}-${{ inputs.historical_year }}-${{ inputs.targets }}-${{ inputs.rolling_days }}-
      - name: Build resumable month bundles
        shell: bash
        run: |
          args=(--init "$INIT" --targets "$TARGETS" --rolling-days "$ROLLING_DAYS" --workers 1 --month-pause-seconds 60)
          if [[ -n "$HISTORICAL_YEAR" ]]; then
            args+=(--historical-year "$HISTORICAL_YEAR")
          fi
          timeout --signal=INT --kill-after=30s 300m python -u scripts/cfsv2_surface_phase_build.py "${args[@]}"
      - name: Save checkpoints even after an unsuccessful build
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/cfsv2-surface-phase
          key: surface-phase-v1-${{ inputs.init }}-${{ inputs.historical_year }}-${{ inputs.targets }}-${{ inputs.rolling_days }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Export completed bundles for reference assembly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-phase-${{ inputs.init }}-${{ inputs.historical_year || 'forecast' }}
          path: .cache/cfsv2-surface-phase/months/
          if-no-files-found: warn
          retention-days: 30
