name: Maintenance - Refresh temperature styling
on:
  push:
    branches: [main]
    paths: [scripts/temperature_display.py]
  workflow_dispatch:
permissions:
  actions: write
  contents: read

concurrency:
  # A newer maintenance run supersedes a stale fan-out.
  group: temperature-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        workflow: [seas5.yml, cansips.yml, c3s.yml, jma.yml, cfsv2.yml, apcc.yml, cma-cpsv3.yml, geos-s2s3.yml, superensemble.yml, nmme.yml]
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WORKFLOW: ${{ matrix.workflow }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize serialized Pages handoff
        shell: bash
        run: : > publish-refs.txt
      - name: Refresh temperature products sequentially
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          # Refresh both temperature products across every operational provider.
          for product in 850mb_temperature_anomaly 2m_temperature_anomaly; do
            # NMME provides only 2-m temperature.
            [[ "$WORKFLOW" == "nmme.yml" && "$product" == "850mb_temperature_anomaly" ]] && continue
            # Give a live producer a bounded hand-off window. Product-scoped
            # concurrency keys below let a stale attempt be superseded.
            wait_seconds=0
            while gh run list --workflow "$WORKFLOW" --limit 50 --json status --jq 'any(.[]; .status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "pending")' | grep -qx true; do
              if (( wait_seconds >= 900 )); then
                echo "::warning::${WORKFLOW} has been active for 15 minutes; dispatching the scoped refresh to replace the stale attempt."
                break
              fi
              sleep 30
              wait_seconds=$((wait_seconds + 30))
            done
            provider="${WORKFLOW%.yml}"
            [[ "$provider" == "cma-cpsv3" ]] && provider=cma_cpsv3
            [[ "$provider" == "geos-s2s3" ]] && provider=geos_s2s3
            curl -fsSL --retry 3 --connect-timeout 15 --max-time 60 \
              "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${provider}_manifest.json" -o published.json
            python scripts/temperature_refresh_plan.py published.json "$WORKFLOW" "$product" > dispatch.json
            cat dispatch.json >> "$GITHUB_STEP_SUMMARY"
            if [[ "$WORKFLOW" == "seas5.yml" || "$WORKFLOW" == "jma.yml" || "$WORKFLOW" == "c3s.yml" ]]; then
              WORKFLOW="$WORKFLOW" python - <<'PY'
          import json
          with open("dispatch.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          payload["style_refresh"] = True
          with open("dispatch.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
              handle.write("\n")
          PY
            fi
            started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            for attempt in 1 2 3 4 5; do
              if gh workflow run "$WORKFLOW" --ref main --json < dispatch.json; then
                break
              fi
              if [[ "$attempt" == 5 ]]; then
                echo "::error::$WORKFLOW dispatch failed after five attempts"
                exit 1
              fi
              sleep $((attempt * 10))
            done
            run_id=""
            for attempt in {1..24}; do
              run_id=$(gh run list --workflow "$WORKFLOW" --branch main --event workflow_dispatch --limit 20 --json databaseId,createdAt --jq ".[] | select(.createdAt >= \"$started\") | .databaseId" | head -1)
              [[ -n "$run_id" ]] && break
              sleep 5
            done
            test -n "$run_id"
            echo "- $WORKFLOW / $product: https://github.com/$GH_REPO/actions/runs/$run_id" >> "$GITHUB_STEP_SUMMARY"
            if gh run watch "$run_id" --exit-status --interval 30; then
              case "$WORKFLOW" in
                seas5.yml)
                  printf '%s\t%s\n' "ECMWF SEAS5 Seasonal Graphics" "$run_id" >> publish-refs.txt
                  ;;
                jma.yml)
                  printf '%s\t%s\n' "JMA Seasonal Graphics" "$run_id" >> publish-refs.txt
                  ;;
                c3s.yml)
                  printf '%s\t%s\n' "C3S Multi-System Seasonal Graphics" "$run_id" >> publish-refs.txt
                  ;;
                *)
                  # Other providers publish through publish-pages workflow_run.
                  ;;
              esac
            else
              echo "::error::$WORKFLOW / $product failed; see run $run_id"
              failed=1
            fi
          done
          exit "$failed"
      - name: Upload serialized Pages handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temperature-publish-refs-${{ matrix.workflow }}
          path: publish-refs.txt
          if-no-files-found: warn
  publish:
    if: ${{ always() && needs.refresh.result != 'cancelled' }}
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REFRESH_RESULT: ${{ needs.refresh.result }}
    steps:
      - name: Download serialized Pages handoffs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: temperature-publish-refs-*
          path: publish-refs
      - name: Publish self-dispatching provider payloads
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          failed=0
          mapfile -t ref_files < <(find publish-refs -type f -name publish-refs.txt -print 2>/dev/null | sort)
          for ref_file in "${ref_files[@]}"; do
            while IFS=$'\t' read -r source_name source_run_id; do
              [[ -z "$source_name" || -z "$source_run_id" ]] && continue
              published=0
              for attempt in 1 2 3 4 5; do
                publish_wait=0
                while gh run list --workflow publish-pages.yml --limit 100 --json status --jq 'any(.[]; .status != "completed")' | grep -qx true; do
                  if (( publish_wait >= 1800 )); then
                    echo "::error::Pages publisher queue did not drain within 30 minutes"
                    break 2
                  fi
                  sleep 15
                  publish_wait=$((publish_wait + 15))
                done
                publish_started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                if ! gh workflow run publish-pages.yml --ref main -f source_workflow="$source_name" -f source_run_id="$source_run_id"; then
                  if [[ "$attempt" == 5 ]]; then
                    echo "::error::Pages dispatch failed for $source_name run $source_run_id"
                    break
                  fi
                  sleep $(($attempt * 10))
                  continue
                fi
                publish_id=""
                for lookup in {1..24}; do
                  publish_id=$(gh run list --workflow publish-pages.yml --event workflow_dispatch --limit 20 --json databaseId,createdAt --jq "map(select(.event == \"workflow_dispatch\" and .createdAt >= \"$publish_started\")) | sort_by(.createdAt) | if length > 0 then .[-1].databaseId else empty end")
                  [[ -n "$publish_id" ]] && break
                  sleep 5
                done
                if [[ -z "$publish_id" ]]; then
                  echo "::error::Could not resolve Pages publisher for $source_name run $source_run_id"
                  [[ "$attempt" == 5 ]] && break
                  sleep $(($attempt * 10))
                  continue
                fi
                if gh run watch "$publish_id" --exit-status --interval 30; then
                  echo "- $source_name / $source_run_id: https://github.com/$GH_REPO/actions/runs/$publish_id" >> "$GITHUB_STEP_SUMMARY"
                  published=1
                  break
                fi
                echo "::warning::Pages publisher $publish_id did not complete successfully; retrying handoff"
                sleep $(($attempt * 10))
              done
              if (( published == 0 )); then
                failed=1
              fi
            done < "$ref_file"
          done
          if [[ "$REFRESH_RESULT" != "success" ]]; then
            echo "::error::At least one producer refresh failed"
            failed=1
          fi
          exit "$failed"

