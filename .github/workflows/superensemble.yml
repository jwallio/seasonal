name: Deduplicated Seasonal Super Ensemble

on:
  schedule:
    # Run after APCC and CMA complete the late-month component release windows.
    - cron: "30 20 22 * *"
  workflow_dispatch:
    inputs:
      product:
        description: "Super-ensemble parameter to generate"
        required: false
        default: "500mb_height_anomaly"
        type: choice
        options:
          - 500mb_height_anomaly
          - 850mb_temperature_anomaly
          - 2m_temperature_anomaly
          - precipitation_anomaly
          - snowfall_anomaly
          - sea_surface_temperature_anomaly
          - mslp_anomaly
          - all
      init:
        description: "Shared initialization as YYYYMM or latest"
        required: false
        default: "latest"
        type: string
      lead_months:
        description: "Target leads, comma-separated"
        required: false
        default: "4,5,6"
        type: string
      seasonal_window:
        description: "Consecutive leads for the seasonal aggregate"
        required: false
        default: "4,5,6"
        type: string
      minimum_members:
        description: "Minimum canonical families required to render"
        required: false
        default: "6"
        type: string

permissions:
  contents: read

concurrency:
  group: seasonal-superensemble-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SUPER_PRODUCT: ${{ inputs.product || '500mb_height_anomaly' }}
      SCHEDULED_SUPER_PRODUCT: all
      SUPER_INIT: ${{ inputs.init || 'latest' }}
      LEAD_MONTHS: ${{ inputs.lead_months || '4,5,6' }}
      SEASONAL_WINDOW: ${{ inputs.seasonal_window || '4,5,6' }}
      MINIMUM_MEMBERS: ${{ inputs.minimum_members || '6' }}
      CANSIPS_WGRIB2: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install super-ensemble dependencies
        run: python -m pip install --upgrade "cdsapi>=0.7.7" cfgrib eccodes xarray netCDF4 matplotlib Pillow requests numpy

      - name: Configure Copernicus CDS API
        env:
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CDS_API_KEY:-}" ]; then
            echo "::error::The CDS_API_KEY repository secret is required for the C3S super-ensemble members."
            exit 1
          fi
          printf 'url: https://cds.climate.copernicus.eu/api\nkey: %s\n' "$CDS_API_KEY" > "$HOME/.cdsapirc"
          chmod 600 "$HOME/.cdsapirc"

      - name: Restore C3S component cache
        uses: actions/cache@v4
        with:
          path: .cache/c3s
          key: superensemble-c3s-${{ runner.os }}-${{ env.SUPER_PRODUCT }}-${{ github.run_id }}-v1
          restore-keys: |
            superensemble-c3s-${{ runner.os }}-${{ env.SUPER_PRODUCT }}-
            c3s-${{ runner.os }}-${{ env.SUPER_PRODUCT }}-
            superensemble-c3s-${{ runner.os }}-
            c3s-${{ runner.os }}-

      - name: Restore CanSIPS family cache
        uses: actions/cache@v4
        with:
          path: .cache/cansips
          key: superensemble-cansips-${{ runner.os }}-${{ env.SUPER_PRODUCT }}-${{ github.run_id }}-v1
          restore-keys: |
            superensemble-cansips-${{ runner.os }}-${{ env.SUPER_PRODUCT }}-
            cansips-${{ runner.os }}-
            superensemble-cansips-${{ runner.os }}-

      - name: Restore CMA CPSv3 source cache
        uses: actions/cache@v4
        with:
          path: .cache/cma-cpsv3
          key: superensemble-cma-cpsv3-${{ runner.os }}-${{ env.SUPER_INIT }}-${{ github.run_id }}-v1
          restore-keys: |
            superensemble-cma-cpsv3-${{ runner.os }}-${{ env.SUPER_INIT }}-
            cma-cpsv3-${{ runner.os }}-${{ env.SUPER_INIT }}-
            cma-cpsv3-${{ runner.os }}-
            superensemble-cma-cpsv3-${{ runner.os }}-

      - name: Restore rolling CFSv2 state
        uses: actions/cache@v4
        with:
          path: .cache/cfsv2
          key: superensemble-cfsv2-${{ runner.os }}-${{ env.SUPER_PRODUCT }}-${{ github.run_id }}-v1
          restore-keys: |
            superensemble-cfsv2-${{ runner.os }}-${{ env.SUPER_PRODUCT }}-
            cfsv2-rolling-
            superensemble-cfsv2-${{ runner.os }}-

      - name: Restore unique NMME component cache
        uses: actions/cache@v4
        with:
          path: .cache/nmme
          key: superensemble-nmme-${{ runner.os }}-${{ env.SUPER_PRODUCT }}-${{ github.run_id }}-v1
          restore-keys: |
            superensemble-nmme-${{ runner.os }}-${{ env.SUPER_PRODUCT }}-
            nmme-${{ runner.os }}-
            superensemble-nmme-${{ runner.os }}-

      - name: Restore NASA GEOS-S2S-3 numerical cache
        uses: actions/cache@v4
        with:
          path: .cache/geos-s2s3
          key: superensemble-geos-${{ runner.os }}-${{ env.SUPER_PRODUCT }}-${{ env.SUPER_INIT }}-${{ github.run_id }}-v2
          restore-keys: |
            superensemble-geos-${{ runner.os }}-${{ env.SUPER_PRODUCT }}-${{ env.SUPER_INIT }}-
            geos-s2s3-${{ runner.os }}-${{ env.SUPER_PRODUCT }}-${{ env.SUPER_INIT }}-
            geos-s2s3-${{ runner.os }}-
            superensemble-geos-${{ runner.os }}-

      - name: Restore published super-ensemble history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/superensemble
          published_manifest=".cache/superensemble/previous_manifest.json"
          temporary_manifest="${published_manifest}.tmp"
          pages_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/superensemble_manifest.json"
          if curl -fsSL --retry 2 --connect-timeout 10 "$pages_url" -o "$temporary_manifest"; then
            mv "$temporary_manifest" "$published_manifest"
            echo "Restored prior super-ensemble manifest."
          else
            rm -f "$temporary_manifest"
            if [ -f "$published_manifest" ]; then
              echo "Could not refresh super-ensemble manifest; retaining cached last-known-good history."
            else
              echo "No prior super-ensemble manifest was available."
            fi
          fi

      - name: Build wgrib2
        if: env.SUPER_PRODUCT != 'snowfall_anomaly' || github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran libopenjp2-7-dev libpng-dev zlib1g-dev
          source_dir="$RUNNER_TEMP/wgrib2-src"
          mkdir -p "$source_dir"
          curl -fsSL "https://ftp.cpc.ncep.noaa.gov/wd51we/wgrib2/wgrib2.tgz" -o "$RUNNER_TEMP/wgrib2.tgz"
          tar -xzf "$RUNNER_TEMP/wgrib2.tgz" -C "$source_dir"
          makefile_dir="$source_dir/grib2"
          export CC=gcc
          export FC=gfortran
          make -C "$makefile_dir" -j2
          wgrib2_bin="$makefile_dir/wgrib2/wgrib2"
          test -x "$wgrib2_bin"
          echo "CANSIPS_WGRIB2=$wgrib2_bin" >> "$GITHUB_ENV"

      - name: Render deduplicated super ensemble
        shell: bash
        run: |
          set -euo pipefail
          product="$SUPER_PRODUCT"
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            product="$SCHEDULED_SUPER_PRODUCT"
          fi
          echo "Rendering super-ensemble product selection: $product"
          python scripts/superensemble_seasonal.py \
            --product "$product" \
            --init "$SUPER_INIT" \
            --lead-months "$LEAD_MONTHS" \
            --seasonal-window "$SEASONAL_WINDOW" \
            --minimum-members "$MINIMUM_MEMBERS" \
            --c3s-cache-dir .cache/c3s \
            --cansips-cache-dir .cache/cansips \
            --cma-cache-dir .cache/cma-cpsv3 \
            --cfsv2-cache-dir .cache/cfsv2 \
            --cfsv2-rolling-state-dir .cache/cfsv2/rolling \
            --cfsv2-anchor-init latest \
            --cfsv2-rolling-days 10 \
            --cfsv2-rolling-member 1 \
            --nmme-cache-dir .cache/nmme \
            --geos-cache-dir .cache/geos-s2s3 \
            --border-cache-dir .cache/superensemble \
            --output-dir public/seasonal/superensemble \
            --manifest public/seasonal/superensemble_manifest.json \
            --previous-manifest .cache/superensemble/previous_manifest.json \
            --retain-cycles 4 \
            --wgrib2 "$CANSIPS_WGRIB2" \
            --request-delay 1.0

      - name: Package super-ensemble Pages payload
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -d public/seasonal/superensemble
          test -f public/seasonal/superensemble/index.html
          test -f public/seasonal/superensemble_manifest.json
          rm -rf pages-payload
          mkdir -p pages-payload/superensemble
          cp -R public/seasonal/superensemble/. pages-payload/superensemble/
          cp public/seasonal/superensemble_manifest.json pages-payload/superensemble_manifest.json

      - name: Upload super-ensemble Pages payload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: superensemble-pages-${{ github.run_id }}
          path: pages-payload
          if-no-files-found: error
          retention-days: 14

