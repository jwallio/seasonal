name: CFSv2 Same Cycle Method Comparison
on:
  pull_request:
    paths: [".github/workflows/cfsv2-method-comparison.yml", "scripts/cfsv2_method_comparison.py"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy requests eccodes matplotlib Pillow
      - uses: actions/cache/restore@v4
        with:
          path: .cache/compare/native
          key: matched21-native-2026090612-${{ matrix.year }}-${{ github.run_id }}
          restore-keys: matched21-native-2026090612-${{ matrix.year }}-
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34176070490
          name: surface-phase-2026090612-${{ matrix.year == 2026 && 'forecast' || matrix.year }}
          path: .cache/compare/months
      - run: python -u scripts/cfsv2_method_comparison.py --init 2026090612 --year "${{ matrix.year }}"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/compare/native
          key: matched21-native-2026090612-${{ matrix.year }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: comparison-input-${{ matrix.year }}
          path: comparison/
  render:
    needs: inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install numpy requests eccodes matplotlib Pillow
      - uses: actions/download-artifact@v4
        with:
          pattern: comparison-input-*
          merge-multiple: true
          path: comparison
      - run: python scripts/cfsv2_method_comparison.py --init 2026090612
      - uses: actions/upload-artifact@v4
        with:
          name: matched-21-cycle-DJF-method-comparison
          path: comparison/
