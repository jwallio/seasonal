name: NASA GEOS-S2S-3 Seasonal Graphics

on:
  schedule:
    # NASA's public seasonal release is normally available during the first
    # week of the month; leave a buffer for the official lookup inventory.
    - cron: "30 16 6 * *"
  workflow_dispatch:
    inputs:
      style_refresh:
        description: "Stage output for a coordinated canonical-style release"
        required: false
        default: false
        type: boolean
      product:
        description: "NASA GEOS-S2S-3 parameter to generate"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - 850mb_temperature_anomaly
          - 2m_temperature_anomaly
          - precipitation_anomaly
          - mslp_anomaly
      init:
        description: "NASA release month as YYYYMM or latest"
        required: false
        default: "latest"
        type: string
      lead_months:
        description: "Target offsets from the NASA release month"
        required: false
        default: "3,4,5"
        type: string
      seasonal_window:
        description: "Consecutive offsets for the seasonal aggregate"
        required: false
        default: "3,4,5"
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  # GEOS is a monthly package; keep the latest attempt for the same release
  # month and avoid duplicate archive downloads.
  group: seasonal-geos-s2s3-${{ inputs.init || 'latest' }}-${{ inputs.product || 'all' }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GEOS_PRODUCT: ${{ inputs.product || 'all' }}
      GEOS_INIT: ${{ inputs.init || 'latest' }}
      LEAD_MONTHS: ${{ inputs.lead_months || '3,4,5' }}
      SEASONAL_WINDOW: ${{ inputs.seasonal_window || '3,4,5' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install NASA numerical-render dependencies
        run: python -m pip install --upgrade xarray netCDF4 matplotlib Pillow requests numpy

      - name: Restore NASA numerical archive cache
        uses: actions/cache@v4
        with:
          path: .cache/geos-s2s3
          key: geos-s2s3-${{ runner.os }}-${{ env.GEOS_PRODUCT }}-${{ env.GEOS_INIT }}-${{ github.run_id }}-v2
          restore-keys: |
            geos-s2s3-${{ runner.os }}-${{ env.GEOS_PRODUCT }}-${{ env.GEOS_INIT }}-
            geos-s2s3-${{ runner.os }}-

      - name: Restore published NASA run history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/geos-s2s3
          published_manifest=".cache/geos-s2s3/previous_manifest.json"
          temporary_manifest="${published_manifest}.tmp"
          pages_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/geos_s2s3_manifest.json"
          if curl -fsSL --retry 2 --connect-timeout 10 "$pages_url" -o "$temporary_manifest"; then
            mv "$temporary_manifest" "$published_manifest"
            echo "Restored prior NASA GEOS-S2S-3 manifest."
          else
            rm -f "$temporary_manifest"
            if [ -f "$published_manifest" ]; then
              echo "Could not refresh NASA GEOS-S2S-3 manifest; retaining cached last-known-good history."
            else
              echo "No prior NASA GEOS-S2S-3 manifest was available."
            fi
          fi

      - name: Render NASA GEOS-S2S-3 numerical anomalies
        run: |
          python scripts/geos_s2s3_seasonal.py \
            --product "$GEOS_PRODUCT" \
            --init "$GEOS_INIT" \
            --lead-months "$LEAD_MONTHS" \
            --seasonal-window "$SEASONAL_WINDOW" \
            --cache-dir .cache/geos-s2s3 \
            --border-cache-dir .cache/geos-s2s3 \
            --output-dir public/seasonal/geos_s2s3 \
            --manifest public/seasonal/geos_s2s3_manifest.json \
            --previous-manifest .cache/geos-s2s3/previous_manifest.json \
            --retain-cycles 4

      - name: Require a complete coordinated NASA payload
        if: ${{ inputs.style_refresh == true }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = {
              "850mb_temperature_anomaly",
              "2m_temperature_anomaly",
              "precipitation_anomaly",
              "mslp_anomaly",
          }
          requested = os.environ["GEOS_INIT"]
          if len(requested) != 6 or not requested.isdigit():
              raise SystemExit(f"coordinated NASA refresh requires an explicit YYYYMM init, got {requested!r}")
          issue_utc = f"{requested[:4]}-{requested[4:]}-01T00:00:00Z"
          payload = json.loads(Path("public/seasonal/geos_s2s3_manifest.json").read_text())
          current = {
              run.get("product"): run
              for run in payload.get("runs", [])
              if isinstance(run, dict) and run.get("init_utc") == issue_utc
          }
          problems = []
          for product in sorted(expected):
              run = current.get(product)
              targets = run.get("targets", []) if run else []
              if not run or run.get("status") != "rendered":
                  problems.append(f"{product}: run did not render")
                  continue
              if len(targets) != 4 or any(
                  target.get("status") != "rendered" or not target.get("image")
                  for target in targets
              ):
                  problems.append(f"{product}: expected four rendered image targets")
          if problems:
              raise SystemExit("incomplete coordinated NASA payload: " + "; ".join(problems))
          print(f"validated complete coordinated NASA payload for {requested}: {len(expected)} products")
          PY

      - name: Package NASA Pages payload
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -d public/seasonal/geos_s2s3
          test -f public/seasonal/geos_s2s3_manifest.json
          rm -rf pages-payload
          mkdir -p pages-payload/geos_s2s3
          cp -R public/seasonal/geos_s2s3/. pages-payload/geos_s2s3/
          cp public/seasonal/geos_s2s3_manifest.json pages-payload/geos_s2s3_manifest.json

      - name: Upload NASA Pages payload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: geos-s2s3-pages-${{ github.run_id }}
          path: pages-payload
          if-no-files-found: error
          retention-days: 14
      # workflow_run is suppressed for workflow_dispatch calls made with the
      # repository Actions token. Publish this child directly so maintenance
      # cannot strand a successful artifact.
      - name: Dispatch Pages publisher for token-launched render
        if: ${{ success() && github.actor == 'github-actions[bot]' && inputs.style_refresh != true }}
        uses: ./.github/actions/publish-pages
        with:
          source-workflow: NASA GEOS-S2S-3 Seasonal Graphics
          source-run-id: ${{ github.run_id }}

