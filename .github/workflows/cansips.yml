name: CanSIPS v3 Seasonal Graphics

on:
  push:
    branches: [main]
    paths:
      - scripts/cansips_native_snow.py
      - tests/test_cansips_native_snow.py
  schedule:
    # ECCC refreshes CanSIPS on the first of each month; use the second-day
    # afternoon buffer so the Datamart inventory has time to settle.
    - cron: "30 16 2 * *"
    # Native Canadian snowfall arrives via C3S on the 10th; retry release delays.
    - cron: "30 13 10-14 * *"
  workflow_dispatch:
    inputs:
      product:
        description: "CanSIPS v3 product bundle to generate"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - 500mb_height_anomaly
          - 500mb_height_anomaly_nh
          - 850mb_temperature_anomaly
          - 2m_temperature_anomaly
          - precipitation_anomaly
          - snowfall_anomaly
          - mslp_anomaly
          - sea_surface_height_anomaly
      render_only:
        description: "Redraw cached grids only (run normal mode once first)"
        type: boolean
        default: false
      init:
        description: "CanSIPS initialization as YYYYMM, YYYYMM0100, or latest"
        required: false
        default: "latest"
        type: string
      lead_months:
        description: "Target leads, comma-separated (September DJF: 3,4,5; native snowfall supports 0-5)"
        required: false
        default: "3,4,5"
        type: string
      seasonal_window:
        description: "Consecutive leads for the seasonal aggregate"
        required: false
        default: "3,4,5"
        type: string
      climo_start:
        description: "First CanSIPS hindcast year"
        required: false
        default: "1991"
        type: string
      climo_end:
        description: "Last CanSIPS hindcast year"
        required: false
        default: "2020"
        type: string

permissions:
  contents: write

concurrency:
  # A second dispatch for the same monthly initialization supersedes the
  # earlier attempt instead of competing for the same Datamart files.
  group: seasonal-cansips-${{ inputs.init || 'latest' }}-${{ inputs.product || 'all' }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CANSIPS_PRODUCT: ${{ inputs.product || (github.event_name == 'push' && 'snowfall_anomaly') || (github.event.schedule == '30 13 10-14 * *' && 'snowfall_anomaly') || 'all' }}
      CANSIPS_INIT: ${{ inputs.init || 'latest' }}
      LEAD_MONTHS: ${{ inputs.lead_months || '3,4,5' }}
      SEASONAL_WINDOW: ${{ inputs.seasonal_window || '3,4,5' }}
      CLIMO_START: ${{ inputs.climo_start || '1991' }}
      CLIMO_END: ${{ inputs.climo_end || '2020' }}
      CANSIPS_WGRIB2: ""
      RENDER_ONLY: ${{ inputs.render_only || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CanSIPS rendering dependencies
        run: python -m pip install --upgrade requests numpy matplotlib Pillow xarray cfgrib eccodes "cdsapi>=0.7.7"

      - name: Validate native snowfall calculation
        run: python tests/test_cansips_native_snow.py

      - name: Restore CanSIPS decoded-grid cache
        uses: actions/cache@v4
        with:
          path: .cache/cansips
          key: cansips-${{ runner.os }}-${{ env.CANSIPS_INIT }}-${{ env.CANSIPS_PRODUCT }}-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cansips-${{ runner.os }}-${{ env.CANSIPS_INIT }}-${{ env.CANSIPS_PRODUCT }}-v3-
            cansips-${{ runner.os }}-${{ env.CANSIPS_INIT }}-${{ env.CANSIPS_PRODUCT }}-
            cansips-${{ runner.os }}-

      - name: Restore published CanSIPS run history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/cansips
          published_manifest=".cache/cansips/previous_manifest.json"
          temporary_manifest="${published_manifest}.tmp"
          pages_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/cansips_manifest.json"
          if curl -fsSL --retry 2 --connect-timeout 10 "$pages_url" -o "$temporary_manifest"; then
            mv "$temporary_manifest" "$published_manifest"
            echo "Restored prior CanSIPS manifest for current-plus-three run retention."
          else
            rm -f "$temporary_manifest"
            if [ -f "$published_manifest" ]; then
              echo "Could not refresh CanSIPS manifest; retaining cached last-known-good history."
            else
              echo "No prior published CanSIPS manifest was available; starting a new history."
            fi
          fi

      - name: Set up wgrib2
        uses: ./.github/actions/setup-wgrib2
        with:
          required: ${{ env.CANSIPS_PRODUCT != 'snowfall_anomaly' && env.RENDER_ONLY != 'true' }}

      - name: Check native snowfall against available C3S data
        if: ${{ github.event_name == 'push' }}
        env:
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
        run: python scripts/cansips_native_snow.py

      - name: Render CanSIPS v3 products
        env:
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
        run: |
          extra_args=()
          if [[ "$RENDER_ONLY" == "true" ]]; then extra_args+=(--render-only); fi
          python scripts/cansips_seasonal.py \
            --product "$CANSIPS_PRODUCT" \
            --init "$CANSIPS_INIT" \
            --lead-months "$LEAD_MONTHS" \
            --seasonal-window "$SEASONAL_WINDOW" \
            --climo-start "$CLIMO_START" \
            --climo-end "$CLIMO_END" \
            --cache-dir .cache/cansips \
            --output-dir public/seasonal/cansips \
            --manifest public/seasonal/cansips_manifest.json \
            --previous-manifest .cache/cansips/previous_manifest.json \
            --retain-runs 4 \
            --common-reference-dir public/seasonal/common_reference/1991-2020 \
            --wgrib2 "$CANSIPS_WGRIB2" \
            --request-delay 1.0 \
            --decode-workers 2 \
            "${extra_args[@]}"

      - name: Package CanSIPS Pages payload
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -d public/seasonal/cansips
          test -f public/seasonal/cansips/index.html
          test -f public/seasonal/cansips_manifest.json
          rm -rf pages-payload
          mkdir -p pages-payload/cansips
          cp -R public/seasonal/cansips/. pages-payload/cansips/
          cp public/seasonal/cansips_manifest.json pages-payload/cansips_manifest.json
          if [ -d public/seasonal/common_reference/1991-2020 ]; then
            mkdir -p pages-payload/common_reference/1991-2020
            cp -R public/seasonal/common_reference/1991-2020/. pages-payload/common_reference/1991-2020/
          fi

      - name: Upload CanSIPS Pages payload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cansips-pages-${{ github.run_id }}
          path: pages-payload
          if-no-files-found: error
          retention-days: 14

