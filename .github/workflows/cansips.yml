name: CanSIPS v3 Seasonal Graphics

on:
  schedule:
    # ECCC refreshes CanSIPS on the first of each month; use the second-day
    # afternoon buffer so the Datamart inventory has time to settle.
    - cron: "30 16 2 * *"
  workflow_dispatch:
    inputs:
      product:
        description: "CanSIPS v3 product bundle to generate"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - 500mb_height_anomaly
          - 500mb_height_anomaly_nh
          - 850mb_temperature_anomaly
          - 2m_temperature_anomaly
          - precipitation_anomaly
          - snowfall_anomaly
          - mslp_anomaly
          - sea_surface_height_anomaly
      init:
        description: "CanSIPS initialization as YYYYMM, YYYYMM0100, or latest"
        required: false
        default: "latest"
        type: string
      lead_months:
        description: "Target leads, comma-separated (DJF default: 4,5,6)"
        required: false
        default: "4,5,6"
        type: string
      seasonal_window:
        description: "Consecutive leads for the seasonal aggregate"
        required: false
        default: "4,5,6"
        type: string
      climo_start:
        description: "First CanSIPS hindcast year"
        required: false
        default: "1991"
        type: string
      climo_end:
        description: "Last CanSIPS hindcast year"
        required: false
        default: "2020"
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CANSIPS_PRODUCT: ${{ inputs.product || 'all' }}
      CANSIPS_INIT: ${{ inputs.init || 'latest' }}
      LEAD_MONTHS: ${{ inputs.lead_months || '4,5,6' }}
      SEASONAL_WINDOW: ${{ inputs.seasonal_window || '4,5,6' }}
      CLIMO_START: ${{ inputs.climo_start || '1991' }}
      CLIMO_END: ${{ inputs.climo_end || '2020' }}
      CANSIPS_WGRIB2: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CanSIPS rendering dependencies
        run: python -m pip install --upgrade requests numpy matplotlib Pillow xarray cfgrib eccodes

      - name: Restore CanSIPS decoded-grid cache
        uses: actions/cache@v4
        with:
          path: .cache/cansips
          key: cansips-${{ runner.os }}-${{ env.CANSIPS_INIT }}-${{ env.CANSIPS_PRODUCT }}-v2
          restore-keys: |
            cansips-${{ runner.os }}-${{ env.CANSIPS_INIT }}-${{ env.CANSIPS_PRODUCT }}-
            cansips-${{ runner.os }}-

      - name: Restore published CanSIPS run history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/cansips
          published_manifest=".cache/cansips/previous_manifest.json"
          temporary_manifest="${published_manifest}.tmp"
          pages_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/cansips_manifest.json"
          if curl -fsSL --retry 2 --connect-timeout 10 "$pages_url" -o "$temporary_manifest"; then
            mv "$temporary_manifest" "$published_manifest"
            echo "Restored prior CanSIPS manifest for current-plus-three run retention."
          else
            rm -f "$temporary_manifest"
            if [ -f "$published_manifest" ]; then
              echo "Could not refresh CanSIPS manifest; retaining cached last-known-good history."
            else
              echo "No prior published CanSIPS manifest was available; starting a new history."
            fi
          fi

      - name: Restore wgrib2 tool cache
        id: wgrib2-cache
        if: env.CANSIPS_PRODUCT != 'snowfall_anomaly'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/wallcloud/wgrib2
          key: wgrib2-${{ runner.os }}-v1

      - name: Build wgrib2 from source when needed
        if: ${{ steps.wgrib2-cache.outputs.cache-hit != 'true' && env.CANSIPS_PRODUCT != 'snowfall_anomaly' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran libopenjp2-7-dev libpng-dev zlib1g-dev
          source_dir="$RUNNER_TEMP/wgrib2-src"
          install_dir="$HOME/.cache/wallcloud/wgrib2"
          mkdir -p "$source_dir" "$install_dir"
          curl -fsSL "https://ftp.cpc.ncep.noaa.gov/wd51we/wgrib2/wgrib2.tgz" -o "$RUNNER_TEMP/wgrib2.tgz"
          tar -xzf "$RUNNER_TEMP/wgrib2.tgz" -C "$source_dir"
          makefile_dir="$source_dir/grib2"
          test -f "$makefile_dir/makefile"
          export CC=gcc
          export FC=gfortran
          make -C "$makefile_dir" -j"$(nproc)"
          wgrib2_bin="$makefile_dir/wgrib2/wgrib2"
          test -x "$wgrib2_bin"
          cp "$wgrib2_bin" "$install_dir/wgrib2"
          chmod +x "$install_dir/wgrib2"

      - name: Select wgrib2 tool
        if: env.CANSIPS_PRODUCT != 'snowfall_anomaly'
        shell: bash
        run: |
          set -euo pipefail
          test -x "$HOME/.cache/wallcloud/wgrib2/wgrib2"
          echo "CANSIPS_WGRIB2=$HOME/.cache/wallcloud/wgrib2/wgrib2" >> "$GITHUB_ENV"

      - name: Save wgrib2 tool cache
        if: ${{ success() && steps.wgrib2-cache.outputs.cache-hit != 'true' && env.CANSIPS_PRODUCT != 'snowfall_anomaly' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/.cache/wallcloud/wgrib2
          key: wgrib2-${{ runner.os }}-v1

      - name: Render CanSIPS v3 products
        run: |
          python scripts/cansips_seasonal.py \
            --product "$CANSIPS_PRODUCT" \
            --init "$CANSIPS_INIT" \
            --lead-months "$LEAD_MONTHS" \
            --seasonal-window "$SEASONAL_WINDOW" \
            --climo-start "$CLIMO_START" \
            --climo-end "$CLIMO_END" \
            --cache-dir .cache/cansips \
            --output-dir public/seasonal/cansips \
            --manifest public/seasonal/cansips_manifest.json \
            --previous-manifest .cache/cansips/previous_manifest.json \
            --retain-runs 4 \
            --common-reference-dir public/seasonal/common_reference/1991-2020 \
            --wgrib2 "$CANSIPS_WGRIB2" \
            --request-delay 1.0

      - name: Package CanSIPS Pages payload
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -d public/seasonal/cansips
          test -f public/seasonal/cansips/index.html
          test -f public/seasonal/cansips_manifest.json
          rm -rf pages-payload
          mkdir -p pages-payload/cansips
          cp -R public/seasonal/cansips/. pages-payload/cansips/
          cp public/seasonal/cansips_manifest.json pages-payload/cansips_manifest.json
          if [ -d public/seasonal/common_reference/1991-2020 ]; then
            mkdir -p pages-payload/common_reference/1991-2020
            cp -R public/seasonal/common_reference/1991-2020/. pages-payload/common_reference/1991-2020/
          fi

      - name: Upload CanSIPS Pages payload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cansips-pages-${{ github.run_id }}
          path: pages-payload
          if-no-files-found: error
          retention-days: 14

