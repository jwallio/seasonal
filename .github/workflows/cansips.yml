name: CanSIPS v3 Seasonal Graphics

on:
  schedule:
    # ECCC's monthly CanSIPS cycle is normally available by the second day.
    - cron: "30 16 2 * *"
  workflow_dispatch:
    inputs:
      product:
        description: "CanSIPS v3 product to generate"
        required: false
        default: "500mb_height_anomaly"
        type: choice
        options:
          - 500mb_height_anomaly
      init:
        description: "CanSIPS initialization as YYYYMM, YYYYMM0100, or latest"
        required: false
        default: "latest"
        type: string
      lead_months:
        description: "Target leads, comma-separated (DJF default: 4,5,6)"
        required: false
        default: "4,5,6"
        type: string
      seasonal_window:
        description: "Consecutive leads for the seasonal aggregate"
        required: false
        default: "4,5,6"
        type: string
      climo_start:
        description: "First CanSIPS hindcast year"
        required: false
        default: "1991"
        type: string
      climo_end:
        description: "Last CanSIPS hindcast year"
        required: false
        default: "2020"
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CANSIPS_PRODUCT: ${{ inputs.product || '500mb_height_anomaly' }}
      CANSIPS_INIT: ${{ inputs.init || 'latest' }}
      LEAD_MONTHS: ${{ inputs.lead_months || '4,5,6' }}
      SEASONAL_WINDOW: ${{ inputs.seasonal_window || '4,5,6' }}
      CLIMO_START: ${{ inputs.climo_start || '1991' }}
      CLIMO_END: ${{ inputs.climo_end || '2020' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CanSIPS rendering dependencies
        run: python -m pip install --upgrade requests numpy matplotlib Pillow

      - name: Restore CanSIPS decoded-grid cache
        uses: actions/cache@v4
        with:
          path: .cache/cansips
          key: cansips-${{ runner.os }}-${{ env.CANSIPS_INIT }}-${{ env.CANSIPS_PRODUCT }}-v1
          restore-keys: |
            cansips-${{ runner.os }}-${{ env.CANSIPS_INIT }}-${{ env.CANSIPS_PRODUCT }}-
            cansips-${{ runner.os }}-

      - name: Restore published CanSIPS run history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/cansips
          published_manifest=".cache/cansips/previous_manifest.json"
          temporary_manifest="${published_manifest}.tmp"
          pages_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/seasonal/cansips_manifest.json"
          if curl -fsSL --retry 2 --connect-timeout 10 "$pages_url" -o "$temporary_manifest"; then
            mv "$temporary_manifest" "$published_manifest"
            echo "Restored prior CanSIPS manifest for current-plus-three run retention."
          else
            rm -f "$temporary_manifest" "$published_manifest"
            echo "No prior published CanSIPS manifest was available; starting a new history."
          fi

      - name: Build wgrib2
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran libopenjp2-7-dev libpng-dev zlib1g-dev
          source_dir="$RUNNER_TEMP/wgrib2-src"
          mkdir -p "$source_dir"
          curl -fsSL "https://ftp.cpc.ncep.noaa.gov/wd51we/wgrib2/wgrib2.tgz" -o "$RUNNER_TEMP/wgrib2.tgz"
          tar -xzf "$RUNNER_TEMP/wgrib2.tgz" -C "$source_dir"
          makefile_dir="$source_dir/grib2"
          test -f "$makefile_dir/makefile"
          export CC=gcc
          export FC=gfortran
          make -C "$makefile_dir" -j2
          wgrib2_bin="$makefile_dir/wgrib2/wgrib2"
          test -x "$wgrib2_bin"
          echo "CANSIPS_WGRIB2=$wgrib2_bin" >> "$GITHUB_ENV"

      - name: Render CanSIPS v3 products
        run: |
          python scripts/cansips_seasonal.py \
            --product "$CANSIPS_PRODUCT" \
            --init "$CANSIPS_INIT" \
            --lead-months "$LEAD_MONTHS" \
            --seasonal-window "$SEASONAL_WINDOW" \
            --climo-start "$CLIMO_START" \
            --climo-end "$CLIMO_END" \
            --cache-dir .cache/cansips \
            --output-dir public/seasonal/cansips \
            --manifest public/seasonal/cansips_manifest.json \
            --previous-manifest .cache/cansips/previous_manifest.json \
            --retain-runs 4 \
            --wgrib2 "$CANSIPS_WGRIB2" \
            --request-delay 0.25

      - name: Package CanSIPS Pages payload
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -d public/seasonal/cansips
          test -f public/seasonal/cansips/index.html
          test -f public/seasonal/cansips_manifest.json
          rm -rf pages-payload
          mkdir -p pages-payload/cansips
          cp -R public/seasonal/cansips/. pages-payload/cansips/
          cp public/seasonal/cansips_manifest.json pages-payload/cansips_manifest.json

      - name: Upload CanSIPS Pages payload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cansips-pages-${{ github.run_id }}
          path: pages-payload
          if-no-files-found: error
          retention-days: 14
