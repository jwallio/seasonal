name: One-time Pages repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/republish-pages-now.yml

permissions:
  actions: write
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore complete CFSv2 Pages payload
        uses: ./.github/actions/publish-pages
        with:
          source-workflow: CFSv2 Rolling Seasonal Graphics
          source-run-id: "34371946994"

      - name: Restore corrected snowfall Pages payload
        uses: ./.github/actions/publish-pages
        with:
          source-workflow: CFSv2 Snowfall Graphics
          source-run-id: "34374639253"
