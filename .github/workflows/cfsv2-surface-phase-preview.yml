name: CFSv2 Corrected Snowfall TEST Preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/cfsv2-surface-phase-preview.yml
      - scripts/cfsv2_surface_phase_preview.py
permissions:
  contents: read
jobs:
  inputs:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/cfsv2-surface-phase'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2026]
    env:
      YEAR: ${{ matrix.year }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy requests eccodes
      - uses: actions/cache/restore@v4
        with:
          path: .cache/phase-preview
          key: phase-preview-v1-${{ matrix.year }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: phase-preview-v1-${{ matrix.year }}-
      - name: Prepare one complete February cycle
        shell: bash
        run: |
          timeout --signal=INT --kill-after=30s 80m python -u - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from cfsv2_surface_phase_build import build_month
          year=int(os.environ['YEAR'])
          build_month(Path('.cache/phase-preview/raw'),Path('.cache/phase-preview/months'),f'{year}090612',f'{year+1}02')
          PY
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/phase-preview
          key: phase-preview-v1-${{ matrix.year }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: preview-input-${{ matrix.year }}
          path: .cache/phase-preview/months/
          if-no-files-found: error
  render:
    needs: inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy requests eccodes matplotlib
      - uses: actions/download-artifact@v4
        with:
          pattern: preview-input-*
          merge-multiple: true
          path: preview-inputs
      - name: Render forecast, reference, and departure test images
        run: python scripts/cfsv2_surface_phase_preview.py --bundles preview-inputs --output preview-output
      - uses: actions/upload-artifact@v4
        with:
          name: corrected-snowfall-TEST-graphics
          path: preview-output/
          if-no-files-found: error
      - name: Explain preview output
        run: echo 'Download corrected-snowfall-TEST-graphics for forecast.png, reference.png and departure.png. February single-cycle example only; no live publishing.' >> "$GITHUB_STEP_SUMMARY"
