name: Maintenance - Refresh 500-mb styling
on:
  push:
    branches: [main]
    paths:
      - scripts/height_display.py
      - .github/workflows/height-style-refresh.yml
  workflow_dispatch:
permissions:
  actions: write
  contents: read

concurrency:
  # A newer style refresh supersedes a stale fan-out.
  group: height-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Keep the maintenance fan-out bounded, but do not serialize every
      # provider behind one six-hour provider attempt.  The provider workers
      # already scope their own data requests and concurrency groups.
      max-parallel: 4
      matrix:
        workflow: [seas5.yml, cansips.yml, c3s.yml, jma.yml, cfsv2.yml, apcc.yml, cma-cpsv3.yml, superensemble.yml]
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WORKFLOW: ${{ matrix.workflow }}
    steps:
      - name: Initialize serialized Pages handoff
        shell: bash
        run: ": > publish-refs.txt"
      - name: Refresh both views sequentially
        id: refresh_products
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          deferred=0
          # The CDS-backed workers can render their complete suite from one
          # representative published cycle; this keeps their account queue
          # serialized while still refreshing both requested height views.
          products=(500mb_height_anomaly 500mb_height_anomaly_nh)
          plan_product=500mb_height_anomaly
          if [[ "$WORKFLOW" == "seas5.yml" || "$WORKFLOW" == "c3s.yml" || "$WORKFLOW" == "jma.yml" ]]; then
            products=(all)
          fi
          for product in "${products[@]}"; do
            request_product="$product"
            [[ "$product" == "all" ]] && request_product="$plan_product
            # Give an existing producer a bounded hand-off window; the
            # product-scoped producer key below prevents cross-product canceling.
            wait_seconds=0
            blocked=0
            while gh run list --workflow "$WORKFLOW" --limit 50 --json status --jq 'any(.[]; .status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "pending")' | grep -qx true; do
              if (( wait_seconds >= 900 )); then
                echo "::warning::${WORKFLOW} is still active after 15 minutes; deferring this style refresh so it cannot cancel a scheduled or release run."
                blocked=1
                break
              fi
              sleep 30
              wait_seconds=$((wait_seconds + 30))
            done
            if (( blocked )); then
              deferred=$((deferred + 1))
              continue
            fi
            # C3S/JMA pressure-level access can lag the current monthly issue.
            # Re-render its last published height cycle so a style-only refresh
            # stays green while the next restricted issue is unavailable.
            init_arg=latest
            if [[ "$WORKFLOW" == "jma.yml" || "$WORKFLOW" == "c3s.yml" ]]; then
              provider="${WORKFLOW%.yml}"
              init_arg=""
              pages_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${provider}_manifest.json"
              if curl -fsSL --retry 2 --connect-timeout 10 "$pages_url" -o published.json; then
                init_arg=$(PRODUCT="$request_product" python - <<'PY'
          import json, os, re
          try:
              payload = json.load(open("published.json", encoding="utf-8"))
          except (OSError, ValueError):
              payload = {}
          for run in payload.get("runs", []):
              if run.get("product") != os.environ["PRODUCT"]:
                  continue
              if run.get("status") not in {"rendered", "decoded", "partial"}:
                  continue
              digits = "".join(re.findall(r"\d", str(run.get("init_utc", ""))))
              if len(digits) >= 10:
                  print(digits[:10])
                  break
          PY
                )
              fi
              if [[ -z "$init_arg" ]]; then
                echo "::warning::No prior accessible $product cycle is published for $WORKFLOW; skipping this style-only product refresh."
                continue
              fi
            fi
            started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            for attempt in 1 2 3 4 5; do
              if [[ "$product" == "all" ]]; then
                dispatch_args=(-f product=all)
              else
                dispatch_args=(-f product="$product")
              fi
              [[ "$WORKFLOW" == "jma.yml" || "$WORKFLOW" == "c3s.yml" ]] && dispatch_args+=(-f init="$init_arg")
              [[ "$WORKFLOW" == "seas5.yml" || "$WORKFLOW" == "jma.yml" || "$WORKFLOW" == "c3s.yml" ]] && dispatch_args+=(-f style_refresh=true)
              if gh workflow run "$WORKFLOW" --ref main "${dispatch_args[@]}"; then
                break
              fi
              if [[ "$attempt" == 5 ]]; then
                echo "::error::$WORKFLOW dispatch failed after five attempts"
                exit 1
              fi
              sleep $((attempt * 10))
            done
            run_id=""
            for attempt in {1..24}; do
              run_id=$(gh run list --workflow "$WORKFLOW" --branch main --event workflow_dispatch --limit 20 --json databaseId,createdAt --jq ".[] | select(.createdAt >= \"$started\") | .databaseId" | head -1)
              [[ -n "$run_id" ]] && break
              sleep 5
            done
            test -n "$run_id"
            echo "- $WORKFLOW / $product: https://github.com/$GH_REPO/actions/runs/$run_id" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::$WORKFLOW / $product dispatched as run $run_id; the provider will publish its Pages artifact on completion."
          done
          if (( deferred )); then
            echo "::warning::$deferred 500-mb style refresh product(s) were deferred because a live producer was already active."
          fi
          exit "$failed"
      - name: Upload serialized Pages handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: height-publish-refs-${{ matrix.workflow }}
          path: publish-refs.txt
          if-no-files-found: warn
  publish:
    if: ${{ always() && needs.refresh.result != 'cancelled' }}
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REFRESH_RESULT: ${{ needs.refresh.result }}
    steps:
      - name: Download serialized Pages handoffs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: height-publish-refs-*
          path: publish-refs
      - name: Publish self-dispatching provider payloads
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          failed=0
          mapfile -t ref_files < <(find publish-refs -type f -name publish-refs.txt -print 2>/dev/null | sort)
          for ref_file in "${ref_files[@]}"; do
            while IFS=$'\t' read -r source_name source_run_id; do
              [[ -z "$source_name" || -z "$source_run_id" ]] && continue
              published=0
              for attempt in 1 2 3 4 5; do
                publish_wait=0
                while gh run list --workflow publish-pages.yml --limit 100 --json status --jq 'any(.[]; .status != "completed")' | grep -qx true; do
                  if (( publish_wait >= 1800 )); then
                    echo "::error::Pages publisher queue did not drain within 30 minutes"
                    break 2
                  fi
                  sleep 15
                  publish_wait=$((publish_wait + 15))
                done
                publish_started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                if ! gh workflow run publish-pages.yml --ref main -f source_workflow="$source_name" -f source_run_id="$source_run_id"; then
                  if [[ "$attempt" == 5 ]]; then
                    echo "::error::Pages dispatch failed for $source_name run $source_run_id"
                    break
                  fi
                  sleep $(($attempt * 10))
                  continue
                fi
                publish_id=""
                for lookup in {1..24}; do
                  publish_id=$(gh run list --workflow publish-pages.yml --event workflow_dispatch --limit 20 --json databaseId,createdAt,displayTitle,event --jq ".[] | select(.event == \"workflow_dispatch\" and .createdAt >= \"$publish_started\" and (.displayTitle | endswith(\" · $source_run_id\"))) | .databaseId" | head -1)
                  [[ -n "$publish_id" ]] && break
                  sleep 5
                done
                if [[ -z "$publish_id" ]]; then
                  echo "::error::Could not resolve Pages publisher for $source_name run $source_run_id"
                  [[ "$attempt" == 5 ]] && break
                  sleep $(($attempt * 10))
                  continue
                fi
                if gh run watch "$publish_id" --exit-status --interval 30; then
                  echo "- $source_name / $source_run_id: https://github.com/$GH_REPO/actions/runs/$publish_id" >> "$GITHUB_STEP_SUMMARY"
                  published=1
                  break
                fi
                echo "::warning::Pages publisher $publish_id did not complete successfully; retrying handoff"
                sleep $(($attempt * 10))
              done
              if (( published == 0 )); then
                failed=1
              fi
            done < "$ref_file"
          done
          if [[ "$REFRESH_RESULT" != "success" ]]; then
            echo "::error::At least one producer refresh failed"
            failed=1
          fi
          exit "$failed"
