name: Maintenance - Refresh canonical seasonal styling

on:
  push:
    branches: [main]
    paths:
      - scripts/seasonal_rendering.py
      - scripts/seasonal_products.py
      - scripts/height_display.py
      - scripts/temperature_display.py
      - scripts/snowfall_display.py
      - scripts/cfsv2_seasonal.py
      - scripts/cfsv2_native_snow.py
      - .github/workflows/height-style-refresh.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  # This workflow path is itself classified as a canonical-style change so
  # release-safety repairs also fan out through the single atomic publisher.
  group: canonical-seasonal-style-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh ${{ matrix.workflow }}
    runs-on: ubuntu-latest
    timeout-minutes: 420
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        workflow:
          - seas5.yml
          - c3s.yml
          - jma.yml
          - cfsv2.yml
          - apcc.yml
          - cma-cpsv3.yml
          - geos-s2s3.yml
          - sfs.yml
          - superensemble.yml
          - nmme.yml
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WORKFLOW: ${{ matrix.workflow }}
    steps:
      - name: Resolve a published CDS initialization
        if: ${{ contains(fromJSON('["c3s.yml","jma.yml"]'), matrix.workflow) }}
        shell: bash
        run: |
          set -euo pipefail
          provider="${WORKFLOW%.yml}"
          manifest_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${provider}_manifest.json"
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 60 "$manifest_url" -o published.json
          init_arg="$(python - <<'PY'
          import json, re
          payload = json.load(open("published.json", encoding="utf-8"))
          for run in payload.get("runs", []):
              if run.get("product") != "500mb_height_anomaly":
                  continue
              if run.get("status") not in {"rendered", "decoded", "partial"}:
                  continue
              digits = "".join(re.findall(r"\d", str(run.get("init_utc", ""))))
              if len(digits) >= 10:
                  print(digits[:10])
                  break
          PY
          )"
          test -n "$init_arg"
          echo "STYLE_INIT=$init_arg" >> "$GITHUB_ENV"

      - name: Dispatch one complete staged provider refresh
        shell: bash
        run: |
          set -euo pipefail
          args=(--repo "$GH_REPO" --ref main -f style_refresh=true)
          if [[ "$WORKFLOW" == "nmme.yml" ]]; then
            args+=(-f products=2m_temperature_anomaly,probability_above_normal,probability_near_normal,probability_below_normal,multi_model_consensus)
            args+=(-f base_product=2m_temperature_anomaly)
          else
            args+=(-f product=all)
          fi
          if [[ -n "${STYLE_INIT:-}" ]]; then
            args+=(-f init="$STYLE_INIT")
          fi

          dispatch_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3 4 5; do
            if gh workflow run "$WORKFLOW" "${args[@]}"; then
              break
            fi
            if (( attempt == 5 )); then
              echo "::error::$WORKFLOW dispatch failed after five attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done

          run_id=""
          for lookup in $(seq 1 36); do
            run_id="$(gh run list --repo "$GH_REPO" --workflow "$WORKFLOW" --event workflow_dispatch \
              --limit 100 --json createdAt,databaseId,headSha \
              --jq ".[] | select(.headSha == \"$GITHUB_SHA\" and .createdAt >= \"$dispatch_started\") | .databaseId" | head -1)"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 5
          done
          test -n "$run_id"
          echo "PRODUCER_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "Dispatched $WORKFLOW as run $run_id." >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for the staged provider payload
        shell: bash
        run: |
          set -euo pipefail
          run_id="${PRODUCER_RUN_ID:?producer run was not resolved}"
          gh run watch "$run_id" --repo "$GH_REPO" --exit-status --interval 30

          case "$WORKFLOW" in
            seas5.yml) slug=seas5; source="ECMWF SEAS5 Seasonal Graphics"; artifact="seas5-pages-$run_id" ;;
            cansips.yml) slug=cansips; source="CanSIPS v3 Seasonal Graphics"; artifact="cansips-pages-$run_id" ;;
            c3s.yml) slug=c3s; source="C3S Multi-System Seasonal Graphics"; artifact="c3s-pages-$run_id" ;;
            jma.yml) slug=jma; source="JMA Seasonal Graphics"; artifact="jma-pages-$run_id" ;;
            cfsv2.yml) slug=cfsv2; source="CFSv2 Rolling Seasonal Graphics"; artifact="cfsv2-pages-$run_id" ;;
            apcc.yml) slug=apcc; source="APCC MME Seasonal Graphics"; artifact="apcc-pages-$run_id" ;;
            cma-cpsv3.yml) slug=cma_cpsv3; source="CMA CPSv3 Seasonal Graphics"; artifact="cma-cpsv3-pages-$run_id" ;;
            geos-s2s3.yml) slug=geos_s2s3; source="NASA GEOS-S2S-3 Seasonal Graphics"; artifact="geos-s2s3-pages-$run_id" ;;
            sfs.yml) slug=sfs; source="NOAA SFS Beta2 Seasonal Graphics"; artifact="sfs-pages-$run_id" ;;
            superensemble.yml) slug=superensemble; source="Deduplicated Seasonal Super Ensemble"; artifact="superensemble-pages-$run_id" ;;
            nmme.yml) slug=nmme; source="NOAA NMME Seasonal Graphics"; artifact="nmme-pages-$run_id" ;;
            *) exit 1 ;;
          esac
          artifact_id="$(gh api "repos/$GH_REPO/actions/runs/$run_id/artifacts" --paginate \
            --jq ".artifacts[] | select(.expired == false and .name == \"$artifact\") | .id" | head -1)"
          test -n "$artifact_id"
          if [[ "$slug" == cfsv2 ]]; then
            snowfall_id="$(gh api "repos/$GH_REPO/actions/runs/$run_id/artifacts" --paginate \
              --jq '.artifacts[] | select(.expired == false and .name == "corrected-snowfall-ready") | .id' | head -1)"
            test -n "$snowfall_id"
          fi

          mkdir -p producer-ref
          printf '%s\t%s\t%s\t%s\n' "$slug" "$run_id" "$artifact" "$source" > producer-ref/producer.tsv

      - name: Upload staged producer reference
        uses: actions/upload-artifact@v4
        with:
          name: canonical-style-ref-${{ matrix.workflow }}
          path: producer-ref/producer.tsv
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: Publish one atomic seasonal style release
    needs: refresh
    if: ${{ always() && needs.refresh.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - name: Checkout Pages handoff helper
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download staged producer references
        uses: actions/download-artifact@v4
        with:
          pattern: canonical-style-ref-*
          path: producer-refs

      # CanSIPS native snowfall uses the same CDS account as C3S, SEAS5, and
      # JMA. Launch it only after the matrix is complete so its own queue guard
      # cannot defer snowfall and leave the aggregate payload incomplete.
      - name: Render the staged CanSIPS payload after shared CDS workers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          dispatch_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3 4 5; do
            if gh workflow run cansips.yml --repo "$GH_REPO" --ref main \
              -f style_refresh=true -f product=all; then
              break
            fi
            if (( attempt == 5 )); then
              echo "::error::cansips.yml dispatch failed after five attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done

          run_id=""
          for lookup in $(seq 1 36); do
            run_id="$(gh run list --repo "$GH_REPO" --workflow cansips.yml --event workflow_dispatch \
              --limit 100 --json createdAt,databaseId,headSha \
              --jq ".[] | select(.headSha == \"$GITHUB_SHA\" and .createdAt >= \"$dispatch_started\") | .databaseId" | head -1)"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$GH_REPO" --exit-status --interval 30

          artifact="cansips-pages-$run_id"
          artifact_id="$(gh api "repos/$GH_REPO/actions/runs/$run_id/artifacts" --paginate \
            --jq ".artifacts[] | select(.expired == false and .name == \"$artifact\") | .id" | head -1)"
          test -n "$artifact_id"
          mkdir -p producer-refs/cansips
          printf '%s\t%s\t%s\t%s\n' cansips "$run_id" "$artifact" \
            "CanSIPS v3 Seasonal Graphics" > producer-refs/cansips/producer.tsv
          echo "Dispatched cansips.yml as serialized run $run_id." >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble all provider payloads without publishing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t refs < <(find producer-refs -name producer.tsv -type f | sort)
          if (( ${#refs[@]} < 2 )); then
            echo "::error::Expected at least CFSv2 and C3S staged provider references, found ${#refs[@]}"
            exit 1
          fi
          for required_slug in cfsv2 c3s; do
            found=false
            for ref in "${refs[@]}"; do
              if awk -F '\\t' -v slug="$required_slug" '$1 == slug { found=1 } END { exit !found }' "$ref"; then
                found=true
                break
              fi
            done
            if [[ "$found" != true ]]; then
              echo "::error::Required staged provider reference missing: $required_slug"
              exit 1
            fi
          done

          mkdir -p canonical-payload/payloads
          : > canonical-payload/producers.tsv
          for ref in "${refs[@]}"; do
            IFS=$'\t' read -r slug run_id artifact source < "$ref"
            test -n "$slug" && test -n "$run_id" && test -n "$artifact" && test -n "$source"
            destination="canonical-payload/payloads/$slug"
            mkdir -p "$destination"
            gh run download "$run_id" --repo "$GH_REPO" --name "$artifact" --dir "$destination"
            printf '%s\t%s\t%s\t%s\n' "$slug" "$run_id" "$artifact" "$source" >> canonical-payload/producers.tsv
            if [[ "$slug" == cfsv2 ]]; then
              mkdir -p canonical-payload/payloads/cfsv2-snow
              gh run download "$run_id" --repo "$GH_REPO" --name corrected-snowfall-ready \
                --dir canonical-payload/payloads/cfsv2-snow
            fi
          done

          for manifest in cfsv2_manifest.json c3s_manifest.json; do
            test "$(find canonical-payload/payloads -name "$manifest" -type f | wc -l)" -ge 1
          done

      - name: Upload atomic canonical-style Pages payload
        uses: actions/upload-artifact@v4
        with:
          name: canonical-seasonal-pages-${{ github.run_id }}
          path: canonical-payload
          if-no-files-found: error
          retention-days: 14

      - name: Publish the complete staged release once
        uses: ./.github/actions/publish-pages
        with:
          source-workflow: Canonical Seasonal Style Refresh
          source-run-id: ${{ github.run_id }}
