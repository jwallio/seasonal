name: APCC MME Seasonal Graphics

on:
  schedule:
    # APCC updates around mid-month; allow several days for the new target
    # month and its far 6-month seasonal window to reach CLIK.
    - cron: "30 16 20 * *"
  workflow_dispatch:
    inputs:
      product:
        description: "APCC parameter to generate"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - 500mb_height_anomaly
          - 850mb_temperature_anomaly
          - 2m_temperature_anomaly
          - precipitation_anomaly
          - sea_surface_temperature_anomaly
          - mslp_anomaly
      init:
        description: "APCC first target month as YYYYMM or latest"
        required: false
        default: "latest"
        type: string
      target_window:
        description: "Three-month offsets from the first target month"
        required: false
        default: "3,4,5"
        type: string
      dataset:
        description: "APCC dataset horizon"
        required: false
        default: "MME_6MONTH"
        type: choice
        options:
          - MME_3MONTH
          - MME_6MONTH
      resolution:
        description: "APCC grid resolution"
        required: false
        default: "2.5"
        type: choice
        options:
          - "1.0"
          - "2.5"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      APCC_PRODUCT: ${{ inputs.product || 'all' }}
      APCC_INIT: ${{ inputs.init || 'latest' }}
      TARGET_WINDOW: ${{ inputs.target_window || '3,4,5' }}
      APCC_DATASET: ${{ inputs.dataset || 'MME_6MONTH' }}
      APCC_RESOLUTION: ${{ inputs.resolution || '2.5' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install APCC rendering dependencies
        run: python -m pip install --upgrade xarray netCDF4 matplotlib Pillow requests numpy

      - name: Check APCC API secret
        env:
          APCC_API_KEY: ${{ secrets.APCC_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${APCC_API_KEY:-}" ]; then
            echo "::error::The APCC_API_KEY repository secret is required for APCC CLIK data."
            exit 1
          fi

      - name: Restore APCC cache
        uses: actions/cache@v4
        with:
          path: .cache/apcc
          key: apcc-${{ runner.os }}-${{ env.APCC_INIT }}-${{ env.APCC_PRODUCT }}-${{ env.APCC_DATASET }}-${{ env.APCC_RESOLUTION }}-v1
          restore-keys: |
            apcc-${{ runner.os }}-${{ env.APCC_INIT }}-
            apcc-${{ runner.os }}-

      - name: Restore published APCC run history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/apcc
          published_manifest=".cache/apcc/previous_manifest.json"
          temporary_manifest="${published_manifest}.tmp"
          pages_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/seasonal/apcc_manifest.json"
          if curl -fsSL --retry 2 --connect-timeout 10 "$pages_url" -o "$temporary_manifest"; then
            mv "$temporary_manifest" "$published_manifest"
            echo "Restored prior APCC manifest."
          else
            rm -f "$temporary_manifest"
            if [ -f "$published_manifest" ]; then
              echo "Could not refresh APCC manifest; retaining cached last-known-good history."
            else
              echo "No prior APCC manifest was available."
            fi
          fi

      - name: Render APCC products
        env:
          APCC_API_KEY: ${{ secrets.APCC_API_KEY }}
        run: |
          python scripts/apcc_seasonal.py \
            --product "$APCC_PRODUCT" \
            --init "$APCC_INIT" \
            --target-window "$TARGET_WINDOW" \
            --dataset "$APCC_DATASET" \
            --resolution "$APCC_RESOLUTION" \
            --cache-dir .cache/apcc \
            --output-dir public/seasonal/apcc \
            --manifest public/seasonal/apcc_manifest.json \
            --previous-manifest .cache/apcc/previous_manifest.json \
            --retain-cycles 4

      - name: Package APCC Pages payload
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -d public/seasonal/apcc
          test -f public/seasonal/apcc_manifest.json
          rm -rf pages-payload
          mkdir -p pages-payload/apcc
          cp -R public/seasonal/apcc/. pages-payload/apcc/
          cp public/seasonal/apcc_manifest.json pages-payload/apcc_manifest.json

      - name: Upload APCC Pages payload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apcc-pages-${{ github.run_id }}
          path: pages-payload
          if-no-files-found: error
          retention-days: 14

