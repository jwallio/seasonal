name: C3S Multi-System Seasonal Graphics
run-name: "C3S ${{ inputs.init || 'latest' }} · ${{ inputs.product || '500mb_height_anomaly' }}"

on:
  # Automatic release detection and dispatch are owned by
  # seasonal-release-check.yml. Keep this workflow as the rendering worker.
  workflow_dispatch:
    inputs:
      product:
        description: "C3S parameter to generate"
        required: false
        default: "500mb_height_anomaly"
        type: choice
        options:
          - all
          - 500mb_height_anomaly
          - 500mb_height_anomaly_nh
          - 850mb_temperature_anomaly
          - 2m_temperature_anomaly
          - precipitation_anomaly
          - snowfall_anomaly
          - mslp_anomaly
      style_refresh:
        description: "Automated style children publish their own Pages payload"
        required: false
        default: false
        type: boolean

      next_worker:
        description: "Optional serialized handoff after this suite"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - cansips_snowfall

      centres:
        description: "C3S centre IDs, or all"
        required: false
        default: "all"
        type: string
      systems:
        description: "Optional centre=system overrides"
        required: false
        default: ""
        type: string
      init:
        description: "C3S initialization as YYYYMM or latest"
        required: false
        default: "latest"
        type: string
      lead_months:
        description: "Target leads, comma-separated"
        required: false
        default: "4,5,6"
        type: string
      seasonal_window:
        description: "Seasonal leads, comma-separated"
        required: false
        default: "4,5,6"
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  # A newer dispatch for the same initialization supersedes an older one. This
  # prevents a delayed full-suite run from occupying the queue after a repair
  # or release-check retry has already been launched.
  group: seasonal-c3s-${{ inputs.init || 'latest' }}-${{ inputs.product || '500mb_height_anomaly' }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      products: ${{ steps.select.outputs.products }}
    steps:
      - name: Select requested products
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PRODUCT: ${{ inputs.product }}
        run: |
          set -euo pipefail
          all_products='["500mb_height_anomaly","500mb_height_anomaly_nh","850mb_temperature_anomaly","2m_temperature_anomaly","precipitation_anomaly","snowfall_anomaly","mslp_anomaly"]'
          if [[ "$EVENT_NAME" == "schedule" || "$REQUESTED_PRODUCT" == "all" ]]; then
            products="$all_products"
          elif [[ -z "$REQUESTED_PRODUCT" ]]; then
            products='["500mb_height_anomaly"]'
          else
            case "$REQUESTED_PRODUCT" in
              500mb_height_anomaly|500mb_height_anomaly_nh|850mb_temperature_anomaly|2m_temperature_anomaly|precipitation_anomaly|snowfall_anomaly|mslp_anomaly) products="[\"$REQUESTED_PRODUCT\"]" ;;
              *) echo "::error::Unsupported C3S product: $REQUESTED_PRODUCT"; exit 1 ;;
            esac
          fi
          echo "products=$products" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    strategy:
      fail-fast: false
      # C3S shares the Copernicus queue with JMA and SEAS5. Two product
      # workers balance suite duration against concurrent lead submissions.
      max-parallel: 2
      matrix:
        product: ${{ fromJSON(needs.plan.outputs.products) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      C3S_PRODUCT: ${{ matrix.product }}
      SCHEDULED_C3S_PRODUCTS: 500mb_height_anomaly,500mb_height_anomaly_nh,850mb_temperature_anomaly,2m_temperature_anomaly,precipitation_anomaly,snowfall_anomaly,mslp_anomaly
      C3S_CENTRES: ${{ inputs.centres || 'all' }}
      C3S_SYSTEMS: ${{ inputs.systems || '' }}
      C3S_INIT: ${{ inputs.init || 'latest' }}
      LEAD_MONTHS: ${{ inputs.lead_months || '4,5,6' }}
      SEASONAL_WINDOW: ${{ inputs.seasonal_window || '4,5,6' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install C3S rendering dependencies
        run: python -m pip install --upgrade "cdsapi>=0.7.7" cfgrib eccodes xarray matplotlib Pillow requests numpy

      - name: Configure Copernicus CDS API
        env:
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CDS_API_KEY:-}" ]; then
            echo "::error::The CDS_API_KEY repository secret is required for current C3S data."
            exit 1
          fi
          printf 'url: https://cds.climate.copernicus.eu/api\nkey: %s\n' "$CDS_API_KEY" > "$HOME/.cdsapirc"
          chmod 600 "$HOME/.cdsapirc"

      - name: Restore C3S cache
        uses: actions/cache@v4
        with:
          path: .cache/c3s
          key: c3s-${{ runner.os }}-${{ env.C3S_PRODUCT }}-${{ github.run_id }}-cds-v2
          restore-keys: |
            c3s-${{ runner.os }}-${{ env.C3S_PRODUCT }}-

      - name: Restore published C3S run history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/c3s
          published_manifest=".cache/c3s/previous_manifest.json"
          temporary_manifest="${published_manifest}.tmp"
          pages_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/c3s_manifest.json"
          if curl -fsSL --retry 2 --connect-timeout 10 "$pages_url" -o "$temporary_manifest"; then
            mv "$temporary_manifest" "$published_manifest"
            echo "Restored prior C3S manifest."
          else
            rm -f "$temporary_manifest"
            if [ -f "$published_manifest" ]; then
              echo "Could not refresh C3S manifest; retaining cached last-known-good history."
            else
              echo "No prior C3S manifest was available."
            fi
          fi

      - name: Render C3S products
        shell: bash
        run: |
          set -euo pipefail
          echo "Rendering C3S product: $C3S_PRODUCT"
          lead_months="$LEAD_MONTHS"
          seasonal_window="$SEASONAL_WINDOW"
          if [[ "$C3S_PRODUCT" == "snowfall_anomaly" ]]; then
            # Native C3S snowfall ends at forecast month 6; for a
            # September initialization, 3,4,5 is the complete DJF window.
            lead_months="3,4,5"
            seasonal_window="3,4,5"
          fi
          python scripts/c3s_seasonal.py \
            --product "$C3S_PRODUCT" \
            --centres "$C3S_CENTRES" \
            --systems "$C3S_SYSTEMS" \
            --init "$C3S_INIT" \
            --lead-months "$lead_months" \
            --seasonal-window "$seasonal_window" \
            --cache-dir .cache/c3s \
            --output-dir public/seasonal/c3s \
            --manifest public/seasonal/c3s_manifest.json \
            --previous-manifest .cache/c3s/previous_manifest.json \
            --retain-cycles 4

      - name: Package product-scoped C3S payload
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -d public/seasonal/c3s
          test -f public/seasonal/c3s_manifest.json
          rm -rf pages-payload
          mkdir -p "pages-payload/$C3S_PRODUCT/c3s"
          cp -R public/seasonal/c3s/. "pages-payload/$C3S_PRODUCT/c3s/"
          cp public/seasonal/c3s_manifest.json "pages-payload/$C3S_PRODUCT/c3s_manifest.json"
          python scripts/write_seasonal_fragment.py \
            --manifest public/seasonal/c3s_manifest.json \
            --product "$C3S_PRODUCT" \
            --init "$C3S_INIT" \
            --output "pages-payload/$C3S_PRODUCT/fragment.json"

      - name: Upload product-scoped C3S payload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: c3s-product-${{ matrix.product }}-${{ github.run_id }}
          path: pages-payload
          if-no-files-found: error
          retention-days: 14

  merge:
    if: ${{ always() && needs.render.result == 'success' }}
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download product-scoped C3S payloads
        uses: actions/download-artifact@v4
        with:
          pattern: c3s-product-*-${{ github.run_id }}
          path: incoming/c3s-products
          merge-multiple: false

      - name: Merge C3S Pages payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pages-payload
          mkdir -p pages-payload/c3s
          cp -R public/seasonal/c3s/. pages-payload/c3s/
          python scripts/merge_seasonal_payloads.py \
            --input-root incoming/c3s-products \
            --output-root pages-payload \
            --asset-dir c3s \
            --manifest-name c3s_manifest.json \
            --retain-cycles 4
          test -d pages-payload/c3s
          test -f pages-payload/c3s_manifest.json

      - name: Upload C3S Pages payload
        uses: actions/upload-artifact@v4
        with:
          name: c3s-pages-${{ github.run_id }}
          path: pages-payload
          if-no-files-found: error
          retention-days: 14

      # Runs launched by seasonal-release-check.yml use GITHUB_TOKEN, so their
      # completion cannot create a workflow_run publisher under GitHub's
      # recursion guard. An explicit workflow_dispatch remains permitted.
      - name: Dispatch C3S Pages publish
        if: ${{ success() && github.actor == 'github-actions[bot]' }}
        uses: ./.github/actions/publish-pages
        with:
          source-workflow: C3S Multi-System Seasonal Graphics
          source-run-id: ${{ github.run_id }}


      - name: Dispatch CanSIPS native snowfall handoff
        if: ${{ success() && github.actor == 'github-actions[bot]' && inputs.next_worker == 'cansips_snowfall' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          C3S_INIT: ${{ inputs.init || 'latest' }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run cansips.yml --repo "$GH_REPO" --ref main \
            -f product=snowfall_anomaly \
            -f init="$C3S_INIT" \
            -f lead_months=3,4,5 \
            -f seasonal_window=3,4,5
