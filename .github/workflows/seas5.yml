name: ECMWF SEAS5 Seasonal Graphics

on:
  schedule:
    # ECMWF releases the 7-month SEAS5 forecast on the 5th at 12 UTC.
    # Leave time for CDS indexing before starting the download.
    - cron: "30 15 5 * *"
  workflow_dispatch:
    inputs:
      product:
        description: "SEAS5 parameter to generate"
        required: false
        default: "500mb_height_anomaly"
        type: choice
        options:
          - 500mb_height_anomaly
          - 2m_temperature_anomaly
          - 850mb_temperature_anomaly
          - precipitation_anomaly
          - snowfall_anomaly
          - snow_depth_anomaly
          - sst_anomaly
          - mslp_anomaly
      init:
        description: "SEAS5 initialization as YYYYMM or latest"
        required: false
        default: "latest"
        type: string
      lead_months:
        description: "Target leads, comma-separated"
        required: false
        default: "4,5,6"
        type: string
      seasonal_window:
        description: "Seasonal leads, comma-separated"
        required: false
        default: "4,5,6"
        type: string
      climo_years:
        description: "SEAS5 hindcast climatology years"
        required: false
        default: "1981-2016"
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SEAS5_PRODUCT: ${{ inputs.product || '500mb_height_anomaly' }}
      SCHEDULED_SEAS5_PRODUCTS: 500mb_height_anomaly,850mb_temperature_anomaly,2m_temperature_anomaly,precipitation_anomaly,snowfall_anomaly,sst_anomaly,mslp_anomaly
      SEAS5_INIT: ${{ inputs.init || 'latest' }}
      LEAD_MONTHS: ${{ inputs.lead_months || '4,5,6' }}
      SEASONAL_WINDOW: ${{ inputs.seasonal_window || '4,5,6' }}
      CLIMO_YEARS: ${{ inputs.climo_years || '1981-2016' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install SEAS5 rendering dependencies
        run: python -m pip install --upgrade "cdsapi>=0.7.7" cfgrib eccodes xarray matplotlib Pillow requests numpy

      - name: Configure Copernicus CDS API
        env:
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CDS_API_KEY:-}" ]; then
            echo "::error::The CDS_API_KEY repository secret is required for current SEAS5 data."
            exit 1
          fi
          printf 'url: https://cds.climate.copernicus.eu/api\nkey: %s\n' "$CDS_API_KEY" > "$HOME/.cdsapirc"
          chmod 600 "$HOME/.cdsapirc"

      - name: Restore SEAS5 CDS cache
        uses: actions/cache@v4
        with:
          path: .cache/seas5
          key: seas5-${{ runner.os }}-${{ env.SEAS5_PRODUCT }}-${{ env.CLIMO_YEARS }}-cds-v1
          restore-keys: |
            seas5-${{ runner.os }}-${{ env.SEAS5_PRODUCT }}-${{ env.CLIMO_YEARS }}-cds-

      - name: Restore published SEAS5 run history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/seas5
          published_manifest=".cache/seas5/previous_manifest.json"
          temporary_manifest="${published_manifest}.tmp"
          pages_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/seas5_manifest.json"
          if curl -fsSL --retry 2 --connect-timeout 10 "$pages_url" -o "$temporary_manifest"; then
            mv "$temporary_manifest" "$published_manifest"
            echo "Restored prior SEAS5 manifest for current-plus-three run retention."
          else
            rm -f "$temporary_manifest"
            if [ -f "$published_manifest" ]; then
              echo "Could not refresh SEAS5 manifest; retaining cached last-known-good history."
            else
              echo "No prior published SEAS5 manifest was available; starting a new history."
            fi
          fi

      - name: Render SEAS5 products
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            IFS=',' read -r -a products <<< "$SCHEDULED_SEAS5_PRODUCTS"
          else
            products=("$SEAS5_PRODUCT")
          fi
          for product in "${products[@]}"; do
            echo "Rendering SEAS5 product: $product"
            python scripts/seas5_seasonal.py \
              --product "$product" \
              --init "$SEAS5_INIT" \
              --lead-months "$LEAD_MONTHS" \
              --seasonal-window "$SEASONAL_WINDOW" \
              --climo-years "$CLIMO_YEARS" \
              --cache-dir .cache/seas5 \
              --output-dir public/seasonal/seas5 \
              --manifest public/seasonal/seas5_manifest.json \
              --previous-manifest .cache/seas5/previous_manifest.json \
              --retain-runs 4 \
              --common-reference-dir .cache/seas5/common-reference \
              --common-reference-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/common_reference/1991-2020/"
          done
      - name: Package SEAS5 Pages payload
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -d public/seasonal/seas5
          test -f public/seasonal/seas5_manifest.json
          rm -rf pages-payload
          mkdir -p pages-payload/seas5
          cp -R public/seasonal/seas5/. pages-payload/seas5/
          cp public/seasonal/seas5_manifest.json pages-payload/seas5_manifest.json

      - name: Upload SEAS5 Pages payload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: seas5-pages-${{ github.run_id }}
          path: pages-payload
          if-no-files-found: error
          retention-days: 14

