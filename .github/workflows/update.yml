name: WeatherNext Runner Custom

on:
  workflow_dispatch:
    inputs:
      run_target:
        description: "[Run] Product bundle or single product"
        required: false
        default: "flagship"
        type: choice
        options:
          - flagship
          - winter_weather
          - conus_core
          - regional_zoom
          - z500_anomalies
          - weather_parameters
          - temperature
          - snowfall
          - all
          - nh_z500a
          - na_z500a
          - conus_mslp_ptype
          - ne_mslp_ptype
          - conus_vort500
          - conus_t2m
          - conus_t2m_anom
          - conus_wind10
          - conus_t850
          - conus_t500
          - conus_omega500
          - conus_sst
          - conus_snow_accum
          - ne_snow_accum
          - ne_zoom_snow_accum
          - mi_wi_snow_accum
          - carolinas_snow_accum
          - custom_csv
      custom_products_csv:
        description: "[Run] Only used when Run Target = custom_csv"
        required: false
        default: "na_z500a,conus_mslp_ptype,conus_vort500,ne_zoom_snow_accum,mi_wi_snow_accum,carolinas_snow_accum"
        type: string
      graphics_profile:
        description: "[Graphics] Primary graphics profile"
        required: false
        default: "rework"
        type: choice
        options:
          - rework
          - legacy
      z500_style:
        description: "[Graphics] 500-mb anomaly style"
        required: false
        default: "default"
        type: choice
        options:
          - default
          - classic
      ensemble_mode:
        description: "[Model] WeatherNext ensemble selection"
        required: false
        default: "first"
        type: choice
        options:
          - first
          - mean
          - median
          - member
      ensemble_member:
        description: "[Model] Ensemble member when mode=member"
        required: false
        default: ""
        type: string
      preview_one_frame:
        description: "[Time Range] Generate only one frame per selected product"
        required: false
        default: false
        type: boolean
      hour_range_preset:
        description: "[Time Range] Run 0 through selected hour using native model step"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - "24"
          - "36"
          - "48"
          - "72"
          - "120"
          - "180"
          - "240"
      hours_csv:
        description: "[Time Range] Explicit forecast hours (overrides preset if set; e.g. 6,12,18)"
        required: false
        default: ""
        type: string
      run_init_utc:
        description: "[Time Range] Optional run init UTC override (example: 2026-02-22T12:00:00Z)"
        required: false
        default: ""
        type: string
      max_dimension:
        description: "[Render Settings] Maximum output dimension in pixels"
        required: false
        default: "900"
        type: choice
        options:
          - "720"
          - "840"
          - "900"
          - "960"
          - "1000"
      export_workers:
        description: "[Render Settings] Parallel worker count for non-z500 products"
        required: false
        default: "3"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
      geography_detail:
        description: "[Render Settings] Border detail mode"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - high
          - low
      snow_ratio_csv:
        description: "[Render Settings] Snow ratios for snowfall products (comma-separated)"
        required: false
        default: "10"
        type: string
      climo_source:
        description: "[Climate] Reanalysis source (ERA5 for T2M; H500 still falls back to MERRA2 in EE)"
        required: false
        default: "era5"
        type: choice
        options:
          - era5
          - merra2
      climo_start_year:
        description: "[Climate] Climatology start year"
        required: false
        default: "1991"
        type: string
      climo_end_year:
        description: "[Climate] Climatology end year"
        required: false
        default: "2020"
        type: string
      run_history_hours:
        description: "[Advanced] Run history retention window in hours"
        required: false
        default: "24"
        type: string
  workflow_call:
    inputs:
      run_target:
        required: false
        default: "flagship"
        type: string
      custom_products_csv:
        required: false
        default: "na_z500a,conus_mslp_ptype,conus_vort500,ne_zoom_snow_accum,mi_wi_snow_accum,carolinas_snow_accum"
        type: string
      graphics_profile:
        required: false
        default: "rework"
        type: string
      z500_style:
        required: false
        default: "default"
        type: string
      ensemble_mode:
        required: false
        default: "first"
        type: string
      ensemble_member:
        required: false
        default: ""
        type: string
      preview_one_frame:
        required: false
        default: false
        type: boolean
      hour_range_preset:
        required: false
        default: "full"
        type: string
      hours_csv:
        required: false
        default: ""
        type: string
      run_init_utc:
        required: false
        default: ""
        type: string
      max_dimension:
        required: false
        default: "900"
        type: string
      export_workers:
        required: false
        default: "3"
        type: string
      geography_detail:
        required: false
        default: "auto"
        type: string
      snow_ratio_csv:
        required: false
        default: "10"
        type: string
      climo_source:
        required: false
        default: "era5"
        type: string
      climo_start_year:
        required: false
        default: "1991"
        type: string
      climo_end_year:
        required: false
        default: "2020"
        type: string
      run_history_hours:
        required: false
        default: "24"
        type: string
  
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write

jobs:
  plan-run:
    runs-on: ubuntu-latest
    outputs:
      product_mode: ${{ steps.plan.outputs.product_mode }}
      selected_products: ${{ steps.plan.outputs.selected_products }}
      snow_ratio_csv: ${{ steps.plan.outputs.snow_ratio_csv }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Resolve Product Selection And Shards
        id: plan
        env:
          RUN_TARGET: ${{ inputs.run_target || 'flagship' }}
          CUSTOM_PRODUCTS_CSV: ${{ inputs.custom_products_csv || '' }}
          CUSTOM_SNOW_RATIOS: ${{ inputs.snow_ratio_csv || '10' }}
          PREVIEW_ONE_FRAME: ${{ inputs.preview_one_frame && 'true' || 'false' }}
          HOUR_RANGE_PRESET: ${{ inputs.hour_range_preset || 'full' }}
          HOURS_CSV: ${{ inputs.hours_csv || '' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          all_products = [
              "nh_z500a",
              "na_z500a",
              "conus_mslp_ptype",
              "ne_mslp_ptype",
              "conus_vort500",
              "conus_t2m",
              "conus_t2m_anom",
              "conus_wind10",
              "conus_t850",
              "conus_t500",
              "conus_omega500",
              "conus_sst",
              "conus_snow_accum",
              "ne_snow_accum",
              "ne_zoom_snow_accum",
              "mi_wi_snow_accum",
              "carolinas_snow_accum",
          ]
          z500_products = {"nh_z500a", "na_z500a"}
          bundles = {
              "flagship": ["na_z500a", "conus_mslp_ptype", "conus_vort500", "ne_zoom_snow_accum", "mi_wi_snow_accum", "carolinas_snow_accum"],
              "winter_weather": ["conus_mslp_ptype", "ne_mslp_ptype", "conus_snow_accum", "ne_snow_accum", "ne_zoom_snow_accum", "mi_wi_snow_accum", "carolinas_snow_accum"],
              "conus_core": ["conus_mslp_ptype", "conus_vort500", "conus_t2m", "conus_t2m_anom", "conus_snow_accum"],
              "regional_zoom": ["na_z500a", "ne_mslp_ptype", "ne_zoom_snow_accum", "mi_wi_snow_accum", "carolinas_snow_accum"],
              "z500_anomalies": ["nh_z500a", "na_z500a"],
              "weather_parameters": ["conus_wind10", "conus_t850", "conus_t500", "conus_omega500", "conus_sst"],
              "temperature": ["conus_t2m", "conus_t2m_anom"],
              "snowfall": ["conus_snow_accum", "ne_snow_accum", "ne_zoom_snow_accum", "mi_wi_snow_accum", "carolinas_snow_accum"],
          }

          selection = (os.environ.get("RUN_TARGET", "").strip() or "flagship")
          custom_csv = os.environ.get("CUSTOM_PRODUCTS_CSV", "").strip()
          custom_snow_ratios = os.environ.get("CUSTOM_SNOW_RATIOS", "").strip() or "10"
          preview = os.environ.get("PREVIEW_ONE_FRAME", "").strip().lower() == "true"
          hour_preset = os.environ.get("HOUR_RANGE_PRESET", "").strip() or "full"
          hours_csv = os.environ.get("HOURS_CSV", "").strip()
          explicit_hours = [item.strip() for item in hours_csv.split(",") if item.strip()]

          if selection == "all":
              product_mode = "all"
              selected_products = []
          elif selection in bundles:
              product_mode = "custom"
              selected_products = bundles[selection]
          elif selection == "custom_csv":
              product_mode = "custom"
              selected_products = [item.strip() for item in custom_csv.split(",") if item.strip()]
              if not selected_products:
                  print("custom_csv selected but custom_products_csv is blank", file=sys.stderr)
                  raise SystemExit(1)
          elif selection in all_products:
              product_mode = "custom"
              selected_products = [selection]
          else:
              print(f"Unknown run_target: {selection}", file=sys.stderr)
              raise SystemExit(1)

          selected_for_planning = all_products if product_mode == "all" else selected_products
          z500_selected = [item for item in selected_for_planning if item in z500_products]
          core_selected = [item for item in selected_for_planning if item not in z500_products]
          is_small_time_window = preview or (explicit_hours and len(explicit_hours) <= 6) or hour_preset in {"24", "36", "48", "72"}
          is_small_selection = len(selected_for_planning) <= 2

          z500_shards = 0
          if z500_selected:
              z500_shards = 1 if (preview or len(z500_selected) == 1) else 2

          core_shards = 0
          if core_selected:
              core_shards = 1 if (preview or (is_small_selection and is_small_time_window)) else 2

          matrix_include = []
          for phase, shard_total in (("z500", z500_shards), ("core", core_shards)):
              for shard_index in range(shard_total):
                  matrix_include.append(
                      {
                          "phase": phase,
                          "shard_index": shard_index,
                          "shard_total": shard_total,
                      }
                  )

          if not matrix_include:
              matrix_include = [{"phase": "core", "shard_index": 0, "shard_total": 1}]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"product_mode={product_mode}\n")
              fh.write(f"selected_products={','.join(selected_products)}\n")
              fh.write(f"snow_ratio_csv={custom_snow_ratios if product_mode == 'custom' else '10'}\n")
              fh.write(f"matrix={json.dumps({'include': matrix_include})}\n")

          print(f"Run target: {selection}")
          print(f"Resolved mode: {product_mode}")
          print(f"Resolved products: {selected_for_planning}")
          print(f"Resolved matrix: {matrix_include}")
          PY

  render-shards:
    needs: plan-run
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      ENABLE_FORGEJO_ARTIFACT_UPLOAD: ${{ github.server_url == 'https://github.com' && '1' || vars.ENABLE_FORGEJO_ARTIFACT_UPLOAD || '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-run.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Libraries
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Map Generator (Shard)
        id: map_generator
        env:
          EE_KEY: ${{ secrets.EE_KEY }}
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
          HOURS_MAX: ${{ inputs.hour_range_preset != 'full' && inputs.hour_range_preset || '' }}
          HOURS_LIMIT: ${{ inputs.preview_one_frame && '1' || '' }}
          HOURS_CSV: ${{ inputs.hours_csv || '' }}
          RUN_INIT_UTC: ${{ inputs.run_init_utc || '' }}
          RUN_HISTORY_HOURS: ${{ inputs.run_history_hours || '24' }}
          WN2_MAX_DIMENSION: ${{ inputs.max_dimension || '900' }}
          WN2_GEOGRAPHY_DETAIL: ${{ inputs.geography_detail || 'auto' }}
          WN2_CLIMO_START_YEAR: ${{ inputs.climo_start_year || '' }}
          WN2_CLIMO_END_YEAR: ${{ inputs.climo_end_year || '' }}
          WN2_CLIMO_SOURCE: ${{ inputs.climo_source || 'era5' }}
          WN2_Z500_STYLE: ${{ inputs.z500_style || 'default' }}
          WN2_ENSEMBLE_MODE: ${{ inputs.ensemble_mode || 'first' }}
          WN2_ENSEMBLE_MEMBER: ${{ inputs.ensemble_member || '' }}
          WN2_PRODUCT_MODE: ${{ needs.plan-run.outputs.product_mode }}
          WN2_SELECTED_PRODUCTS: ${{ needs.plan-run.outputs.selected_products }}
          SNOW_RATIO_CSV: ${{ needs.plan-run.outputs.snow_ratio_csv }}
          EXPORT_WORKERS: ${{ matrix.phase == 'core' && (inputs.export_workers || '2') || '1' }}
          WN2_NH_RENDER_MODE: ${{ inputs.graphics_profile == 'legacy' && 'legacy' || 'polar' }}
          WN2_HOUR_SHARD_INDEX: ${{ matrix.shard_index }}
          WN2_HOUR_SHARD_TOTAL: ${{ matrix.shard_total }}
          WN2_RESUME_EXISTING: "1"
          WN2_SKIP_CLEANUP_RUN_DIR: "1"
          WN2_ALLOW_NO_PRODUCTS: "1"
          WN2_RUN_NH_Z500A: ${{ matrix.phase == 'z500' && '1' || '' }}
          WN2_RUN_NA_Z500A: ${{ matrix.phase == 'z500' && '1' || '' }}
          WN2_RUN_CONUS_MSLP_PTYPE: ${{ matrix.phase == 'core' && '1' || '' }}
          WN2_RUN_NE_MSLP_PTYPE: ${{ matrix.phase == 'core' && '1' || '' }}
          WN2_RUN_CONUS_VORT500: ${{ matrix.phase == 'core' && '1' || '' }}
          WN2_RUN_CONUS_T2M: ${{ matrix.phase == 'core' && '1' || '' }}
          WN2_RUN_CONUS_T2M_ANOM: ${{ matrix.phase == 'core' && '1' || '' }}
          WN2_RUN_CONUS_WIND10: ${{ matrix.phase == 'core' && '1' || '' }}
          WN2_RUN_CONUS_T850: ${{ matrix.phase == 'core' && '1' || '' }}
          WN2_RUN_CONUS_T500: ${{ matrix.phase == 'core' && '1' || '' }}
          WN2_RUN_CONUS_OMEGA500: ${{ matrix.phase == 'core' && '1' || '' }}
          WN2_RUN_CONUS_SST: ${{ matrix.phase == 'core' && '1' || '' }}
          WN2_RUN_CONUS_SNOW_ACCUM: ${{ matrix.phase == 'core' && '1' || '' }}
          WN2_RUN_NE_SNOW_ACCUM: ${{ matrix.phase == 'core' && '1' || '' }}
          WN2_RUN_NE_ZOOM_SNOW_ACCUM: ${{ matrix.phase == 'core' && '1' || '' }}
          WN2_RUN_MI_WI_SNOW_ACCUM: ${{ matrix.phase == 'core' && '1' || '' }}
          WN2_RUN_CAROLINAS_SNOW_ACCUM: ${{ matrix.phase == 'core' && '1' || '' }}
        run: python main.py

      - name: Smoke Test Outputs (Shard)
        env:
          WN2_MAX_DIMENSION: ${{ inputs.max_dimension || '900' }}
          WN2_SMOKE_ALLOW_EMPTY: "1"
        run: python tests/smoke_outputs.py

      - name: Report generator failure (shard)
        if: ${{ failure() && steps.map_generator.outcome == 'failure' }}
        run: |
          echo "Shard generation failed; artifact upload will continue with partial outputs."

      - name: Upload Shard Artifacts
        if: ${{ always() && env.ENABLE_FORGEJO_ARTIFACT_UPLOAD == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.phase }}-${{ matrix.shard_index }}
          path: |
            public/runs/**
          if-no-files-found: warn
          retention-days: 2

      - name: List shard outputs when artifact upload is disabled
        if: ${{ always() && env.ENABLE_FORGEJO_ARTIFACT_UPLOAD != '1' }}
        run: |
          echo "Artifact upload disabled; listing generated shard files instead."
          find public -maxdepth 3 -type f | sort | sed -n '1,300p'

  merge-and-deploy:
    needs:
      - plan-run
      - render-shards
    if: ${{ always() && needs.plan-run.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      ENABLE_FORGEJO_ARTIFACT_UPLOAD: ${{ github.server_url == 'https://github.com' && '1' || vars.ENABLE_FORGEJO_ARTIFACT_UPLOAD || '0' }}
      LOCAL_WN2_PUBLISH_DIR: ${{ github.server_url != 'https://github.com' && (vars.LOCAL_WN2_PUBLISH_DIR || '') || '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Libraries
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Recent Runs From GitHub Pages
        if: ${{ github.server_url == 'https://github.com' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p public
          REMOTE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "${REMOTE_URL}" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "${REMOTE_URL}" .gh-pages
            if [ -f .gh-pages/runs_manifest.json ]; then
              cp .gh-pages/runs_manifest.json public/runs_manifest.json
            fi
            if [ -d .gh-pages/runs ]; then
              mkdir -p public/runs
              cp -R .gh-pages/runs/. public/runs/
            fi
          else
            echo "No gh-pages branch yet; starting with a fresh public/ directory."
          fi

      # On Forgejo, restore/publish directly from the localhost Caddy bind mount.
      - name: Restore Recent Runs From Local Publish Dir
        if: ${{ github.server_url != 'https://github.com' }}
        run: |
          mkdir -p public
          if [ -n "${LOCAL_WN2_PUBLISH_DIR}" ] && [ -d "${LOCAL_WN2_PUBLISH_DIR}" ]; then
            python - <<'PY'
            from pathlib import Path
            import os
            import shutil

            src = Path(os.environ["LOCAL_WN2_PUBLISH_DIR"])
            dst = Path("public")
            manifest = src / "runs_manifest.json"
            runs_dir = src / "runs"

            if manifest.exists():
                shutil.copy2(manifest, dst / "runs_manifest.json")
            if runs_dir.exists():
                target = dst / "runs"
                target.mkdir(parents=True, exist_ok=True)
                for child in runs_dir.iterdir():
                    out = target / child.name
                    if child.is_dir():
                        shutil.copytree(child, out, dirs_exist_ok=True)
                    else:
                        shutil.copy2(child, out)
            print(f"Seeded public/ from {src}")
            PY
          else
            echo "No mounted LOCAL_WN2_PUBLISH_DIR available; starting from a fresh public/ directory."
            echo "To enable local publish, mount D:/weather-projects/wn2/public into the Forgejo runner container."
          fi

      - name: Download Shard Artifacts
        if: ${{ env.ENABLE_FORGEJO_ARTIFACT_UPLOAD == '1' }}
        uses: actions/download-artifact@v4
        with:
          path: .shards

      - name: Merge Shard Frames
        run: |
          mkdir -p public/runs
          merged=0
          if [ -d .shards ]; then
            while IFS= read -r -d '' run_dir; do
              cp -R "${run_dir}/." public/runs/
              merged=1
            done < <(find .shards -type d -path '*/public/runs' -print0)
            while IFS= read -r -d '' run_dir; do
              cp -R "${run_dir}/." public/runs/
              merged=1
            done < <(find .shards -type d -path '*/runs' -print0)
            while IFS= read -r -d '' run_dir; do
              run_id="$(basename "$run_dir")"
              if [[ "$run_id" =~ ^[0-9]{10}$ ]]; then
                mkdir -p "public/runs/$run_id"
                cp -R "${run_dir}/." "public/runs/$run_id/"
                merged=1
              fi
            done < <(find .shards -type d -print0)
          fi
          if [ "$merged" -eq 0 ]; then
            echo "No shard run directories found after artifact download."
          fi

      - name: Run Map Generator (Resume + Reconcile)
        id: map_generator_reconcile
        env:
          EE_KEY: ${{ secrets.EE_KEY }}
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
          HOURS_MAX: ${{ inputs.hour_range_preset != 'full' && inputs.hour_range_preset || '' }}
          HOURS_LIMIT: ${{ inputs.preview_one_frame && '1' || '' }}
          HOURS_CSV: ${{ inputs.hours_csv || '' }}
          RUN_INIT_UTC: ${{ inputs.run_init_utc || '' }}
          RUN_HISTORY_HOURS: ${{ inputs.run_history_hours || '24' }}
          WN2_MAX_DIMENSION: ${{ inputs.max_dimension || '900' }}
          WN2_GEOGRAPHY_DETAIL: ${{ inputs.geography_detail || 'auto' }}
          WN2_CLIMO_START_YEAR: ${{ inputs.climo_start_year || '' }}
          WN2_CLIMO_END_YEAR: ${{ inputs.climo_end_year || '' }}
          WN2_CLIMO_SOURCE: ${{ inputs.climo_source || 'era5' }}
          WN2_Z500_STYLE: ${{ inputs.z500_style || 'default' }}
          WN2_ENSEMBLE_MODE: ${{ inputs.ensemble_mode || 'first' }}
          WN2_ENSEMBLE_MEMBER: ${{ inputs.ensemble_member || '' }}
          WN2_PRODUCT_MODE: ${{ needs.plan-run.outputs.product_mode }}
          WN2_SELECTED_PRODUCTS: ${{ needs.plan-run.outputs.selected_products }}
          SNOW_RATIO_CSV: ${{ needs.plan-run.outputs.snow_ratio_csv }}
          EXPORT_WORKERS: ${{ inputs.export_workers || '2' }}
          WN2_NH_RENDER_MODE: ${{ inputs.graphics_profile == 'legacy' && 'legacy' || 'polar' }}
          WN2_RESUME_EXISTING: "1"
          WN2_SKIP_CLEANUP_RUN_DIR: "1"
          WN2_RECONCILE_ONLY: "1"
          WN2_RUN_NH_Z500A: "1"
          WN2_RUN_NA_Z500A: "1"
          WN2_RUN_CONUS_MSLP_PTYPE: "1"
          WN2_RUN_NE_MSLP_PTYPE: "1"
          WN2_RUN_CONUS_VORT500: "1"
          WN2_RUN_CONUS_T2M: "1"
          WN2_RUN_CONUS_T2M_ANOM: "1"
          WN2_RUN_CONUS_WIND10: "1"
          WN2_RUN_CONUS_T850: "1"
          WN2_RUN_CONUS_T500: "1"
          WN2_RUN_CONUS_OMEGA500: "1"
          WN2_RUN_CONUS_SST: "1"
          WN2_RUN_CONUS_SNOW_ACCUM: "1"
          WN2_RUN_NE_SNOW_ACCUM: "1"
          WN2_RUN_NE_ZOOM_SNOW_ACCUM: "1"
          WN2_RUN_MI_WI_SNOW_ACCUM: "1"
          WN2_RUN_CAROLINAS_SNOW_ACCUM: "1"
        run: python main.py

      - name: Smoke Test Outputs (Reconcile)
        env:
          WN2_MAX_DIMENSION: ${{ inputs.max_dimension || '900' }}
        run: python tests/smoke_outputs.py

      - name: Report generator failure (reconcile)
        if: ${{ failure() && steps.map_generator_reconcile.outcome == 'failure' }}
        run: |
          echo "Reconcile run failed; deploying retained/partial outputs from public/."

      - name: Upload Final Public Artifacts
        if: ${{ always() && env.ENABLE_FORGEJO_ARTIFACT_UPLOAD == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: public-final
          path: |
            public/index.html
            public/runs_manifest.json
            public/runs/**
          if-no-files-found: warn
          retention-days: 5

      - name: List final public outputs when artifact upload is disabled
        if: ${{ always() && env.ENABLE_FORGEJO_ARTIFACT_UPLOAD != '1' }}
        run: |
          echo "Artifact upload disabled; listing final public files instead."
          find public -maxdepth 3 -type f | sort | sed -n '1,300p'

      - name: Deploy to GitHub Pages
        if: ${{ success() && github.server_url == 'https://github.com' }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

      - name: Publish to local Caddy root
        if: ${{ success() && github.server_url != 'https://github.com' && env.LOCAL_WN2_PUBLISH_DIR != '' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import shutil

          src = Path("public")
          dst = Path(os.environ["LOCAL_WN2_PUBLISH_DIR"])
          if not dst.exists():
              raise SystemExit(
                  "Configured LOCAL_WN2_PUBLISH_DIR does not exist inside the runner: "
                  f"{dst}\n"
                  "Bind-mount D:/weather-projects/wn2/public into the Forgejo runner and "
                  "set LOCAL_WN2_PUBLISH_DIR to that mount path."
              )

          for child in dst.iterdir():
              if child.is_dir():
                  shutil.rmtree(child)
              else:
                  child.unlink()
          for child in src.iterdir():
              target = dst / child.name
              if child.is_dir():
                  shutil.copytree(child, target, dirs_exist_ok=True)
              else:
                  shutil.copy2(child, target)
          print(f"Published {src} to {dst}")
          PY

      - name: Explain skipped local publish
        if: ${{ success() && github.server_url != 'https://github.com' && env.LOCAL_WN2_PUBLISH_DIR == '' }}
        run: |
          echo "Local publish skipped."
          echo "This Forgejo runner container cannot currently write to D:/weather-projects/wn2/public."
          echo "Mount that host path into the runner and set LOCAL_WN2_PUBLISH_DIR to enable direct localhost publishing."
