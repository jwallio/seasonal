name: Publish Seasonal Model Dashboard Pages

on:
  workflow_run:
    workflows:
      - WeatherNext Runner
      - WeatherNext Runner Custom
      - CFSv2 Rolling Seasonal Graphics
      - CFSv2 Snowfall Graphics
      - CanSIPS v3 Seasonal Graphics
      - CMA CPSv3 Seasonal Graphics
      - APCC MME Seasonal Graphics
      - NASA GEOS-S2S-3 Seasonal Graphics
      - NOAA NMME Seasonal Graphics
      - Deduplicated Seasonal Super Ensemble
      - Seasonal 500-mb Pattern Analogs
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_workflow:
        description: "Completed workflow whose Pages artifact should be published"
        required: true
        type: choice
        options:
          - WeatherNext Runner
          - WeatherNext Runner Custom
          - CFSv2 Rolling Seasonal Graphics
          - CFSv2 Snowfall Graphics
          - ECMWF SEAS5 Seasonal Graphics
          - CanSIPS v3 Seasonal Graphics
          - CMA CPSv3 Seasonal Graphics
          - C3S Multi-System Seasonal Graphics
          - JMA Seasonal Graphics
          - APCC MME Seasonal Graphics
          - NASA GEOS-S2S-3 Seasonal Graphics
          - NOAA NMME Seasonal Graphics
          - Deduplicated Seasonal Super Ensemble
          - Seasonal 500-mb Pattern Analogs
          - Native Snowfall Estimate Page
      source_run_id:
        description: "Artifact run ID (use 0 for Native Snowfall Estimate Page)"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: wn2-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SOURCE_WORKFLOW: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name || inputs.source_workflow }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_run_id }}
    steps:
      - name: Checkout current Pages tree
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1

      - name: Checkout dashboard source
        uses: actions/checkout@v4
        with:
          ref: main
          path: dashboard-source
          sparse-checkout: |
            public/seasonal/index.html
            public/seasonal/dashboard.css
            public/seasonal/dashboard.js
            public/seasonal/cfsv2/index.html
            public/seasonal/cfsv2/native-snowfall/
            public/seasonal/seas5/index.html
            public/seasonal/c3s/index.html
            public/seasonal/cma_cpsv3/index.html
            public/seasonal/jma/index.html
            public/seasonal/apcc/index.html
            public/seasonal/geos_s2s3/index.html
            public/seasonal/nmme/index.html
            public/seasonal/superensemble/index.html
            scripts/seasonal_products.py
            scripts/build_seasonal_catalog.py
            scripts/build_seasonal_share_images.py
            scripts/build_seasonal_thumbnails.py
            scripts/validate_native_snow_snapshot.py
            scripts/purge_retired_seasonal_products.py
          sparse-checkout-cone-mode: false

      - name: Normalize source workflow name
        shell: bash
        run: |
          set -euo pipefail
          case "$SOURCE_WORKFLOW" in
            "CFSv2 snowfall"*)
              echo "SOURCE_WORKFLOW=CFSv2 Snowfall Graphics" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Set up thumbnail runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install thumbnail dependency
        run: python -m pip install --disable-pip-version-check --quiet Pillow

      - name: Download WN2 payload
        if: ${{ env.SOURCE_WORKFLOW == 'WeatherNext Runner' || env.SOURCE_WORKFLOW == 'WeatherNext Runner Custom' }}
        uses: actions/download-artifact@v4
        with:
          name: wn2-pages-${{ env.SOURCE_RUN_ID }}
          path: incoming/wn2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download CFSv2 payload
        if: ${{ env.SOURCE_WORKFLOW == 'CFSv2 Rolling Seasonal Graphics' || env.SOURCE_WORKFLOW == 'CFSv2 Snowfall Graphics' }}
        uses: actions/download-artifact@v4
        with:
          name: cfsv2-pages-${{ env.SOURCE_RUN_ID }}
          path: incoming/cfsv2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download SEAS5 payload
        if: ${{ env.SOURCE_WORKFLOW == 'ECMWF SEAS5 Seasonal Graphics' }}
        uses: actions/download-artifact@v4
        with:
          name: seas5-pages-${{ env.SOURCE_RUN_ID }}
          path: incoming/seas5
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download CanSIPS payload
        if: ${{ env.SOURCE_WORKFLOW == 'CanSIPS v3 Seasonal Graphics' }}
        uses: actions/download-artifact@v4
        with:
          name: cansips-pages-${{ env.SOURCE_RUN_ID }}
          path: incoming/cansips
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download C3S payload
        if: ${{ env.SOURCE_WORKFLOW == 'C3S Multi-System Seasonal Graphics' }}
        uses: actions/download-artifact@v4
        with:
          name: c3s-pages-${{ env.SOURCE_RUN_ID }}
          path: incoming/c3s
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download CMA CPSv3 payload
        if: ${{ env.SOURCE_WORKFLOW == 'CMA CPSv3 Seasonal Graphics' }}
        uses: actions/download-artifact@v4
        with:
          name: cma-cpsv3-pages-${{ env.SOURCE_RUN_ID }}
          path: incoming/cma_cpsv3
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download NMME payload
        if: ${{ env.SOURCE_WORKFLOW == 'NOAA NMME Seasonal Graphics' }}
        uses: actions/download-artifact@v4
        with:
          name: nmme-pages-${{ env.SOURCE_RUN_ID }}
          path: incoming/nmme
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download JMA payload
        if: ${{ env.SOURCE_WORKFLOW == 'JMA Seasonal Graphics' }}
        uses: actions/download-artifact@v4
        with:
          name: jma-pages-${{ env.SOURCE_RUN_ID }}
          path: incoming/jma
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download APCC payload
        if: ${{ env.SOURCE_WORKFLOW == 'APCC MME Seasonal Graphics' }}
        uses: actions/download-artifact@v4
        with:
          name: apcc-pages-${{ env.SOURCE_RUN_ID }}
          path: incoming/apcc
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download NASA GEOS-S2S-3 payload
        if: ${{ env.SOURCE_WORKFLOW == 'NASA GEOS-S2S-3 Seasonal Graphics' }}
        uses: actions/download-artifact@v4
        with:
          name: geos-s2s3-pages-${{ env.SOURCE_RUN_ID }}
          path: incoming/geos_s2s3
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download super-ensemble payload
        if: ${{ env.SOURCE_WORKFLOW == 'Deduplicated Seasonal Super Ensemble' }}
        uses: actions/download-artifact@v4
        with:
          name: superensemble-pages-${{ env.SOURCE_RUN_ID }}
          path: incoming/superensemble
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download seasonal analog payload
        if: ${{ env.SOURCE_WORKFLOW == 'Seasonal 500-mb Pattern Analogs' }}
        uses: actions/download-artifact@v4
        with:
          name: analog-pages-${{ env.SOURCE_RUN_ID }}
          path: incoming/analogs
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Merge payload into the Pages tree
        shell: bash
        run: |
          set -euo pipefail

          # After the repository is renamed to seasonal, gh-pages maps
          # directly to /seasonal/. Migrate the existing nested tree once and
          # retain the legacy WeatherNext viewer below /seasonal/wn2/.
          if [ -d site/seasonal ]; then
            mkdir -p site/wn2
            if [ -f site/index.html ]; then
              if [ ! -f site/wn2/index.html ]; then
                mv site/index.html site/wn2/index.html
              else
                rm -f site/index.html
              fi
            fi
            if [ -f site/runs_manifest.json ]; then
              if [ ! -f site/wn2/runs_manifest.json ]; then
                mv site/runs_manifest.json site/wn2/runs_manifest.json
              else
                rm -f site/runs_manifest.json
              fi
            fi
            if [ -d site/runs ]; then
              mkdir -p site/wn2/runs
              cp -R site/runs/. site/wn2/runs/
              rm -rf site/runs
            fi
            cp -R site/seasonal/. site/
            rm -rf site/seasonal
          fi

          test -f site/index.html || test -f site/wn2/index.html
          test -f dashboard-source/public/seasonal/index.html
          test -f dashboard-source/public/seasonal/dashboard.css
          test -f dashboard-source/public/seasonal/dashboard.js
          test -f dashboard-source/public/seasonal/cfsv2/index.html
          test -f dashboard-source/public/seasonal/seas5/index.html
          cp dashboard-source/public/seasonal/index.html site/index.html
          cp dashboard-source/public/seasonal/dashboard.css site/dashboard.css
          cp dashboard-source/public/seasonal/dashboard.js site/dashboard.js
          mkdir -p site/cfsv2 site/seas5 site/c3s site/cma_cpsv3 site/jma site/apcc site/geos_s2s3 site/nmme site/superensemble
          cp dashboard-source/public/seasonal/cfsv2/index.html site/cfsv2/index.html
          cp dashboard-source/public/seasonal/seas5/index.html site/seas5/index.html
          cp dashboard-source/public/seasonal/c3s/index.html site/c3s/index.html
          cp dashboard-source/public/seasonal/cma_cpsv3/index.html site/cma_cpsv3/index.html
          cp dashboard-source/public/seasonal/jma/index.html site/jma/index.html
          cp dashboard-source/public/seasonal/apcc/index.html site/apcc/index.html
          cp dashboard-source/public/seasonal/geos_s2s3/index.html site/geos_s2s3/index.html
          cp dashboard-source/public/seasonal/nmme/index.html site/nmme/index.html
          cp dashboard-source/public/seasonal/superensemble/index.html site/superensemble/index.html

          case "$SOURCE_WORKFLOW" in
            "Native Snowfall Estimate Page")
              # Static reviewed snapshot; no model run or incoming payload.
              ;;
            "WeatherNext Runner"|"WeatherNext Runner Custom")
              payload_root=incoming/wn2
              if [ -d "$payload_root/pages-payload" ]; then
                payload_root="$payload_root/pages-payload"
              elif [ -d "$payload_root/.pages-payload" ]; then
                payload_root="$payload_root/.pages-payload"
              fi
              test -f "$payload_root/index.html"
              test -f "$payload_root/runs_manifest.json"
              mkdir -p site/wn2
              sed 's#href="seasonal/"#href="../"#g' "$payload_root/index.html" > site/wn2/index.html
              cp "$payload_root/runs_manifest.json" site/wn2/runs_manifest.json
              mkdir -p site/wn2/runs
              if [ -d "$payload_root/runs" ]; then
                cp -R "$payload_root/runs/." site/wn2/runs/
              fi
              ;;
            "CFSv2 Rolling Seasonal Graphics"|"CFSv2 Snowfall Graphics")
              payload_root=incoming/cfsv2
              if [ -d "$payload_root/pages-payload" ]; then
                payload_root="$payload_root/pages-payload"
              elif [ -d "$payload_root/.pages-payload" ]; then
                payload_root="$payload_root/.pages-payload"
              fi
              test -f "$payload_root/cfsv2_manifest.json"
              mkdir -p site/cfsv2
              cp -R "$payload_root/cfsv2/." site/cfsv2/
              cp "$payload_root/cfsv2_manifest.json" site/cfsv2_manifest.json
              ;;
            "ECMWF SEAS5 Seasonal Graphics")
              payload_root=incoming/seas5
              if [ -d "$payload_root/pages-payload" ]; then
                payload_root="$payload_root/pages-payload"
              elif [ -d "$payload_root/.pages-payload" ]; then
                payload_root="$payload_root/.pages-payload"
              fi
              test -f "$payload_root/seas5_manifest.json"
              mkdir -p site/seas5
              cp -R "$payload_root/seas5/." site/seas5/
              cp "$payload_root/seas5_manifest.json" site/seas5_manifest.json
              ;;
            "CanSIPS v3 Seasonal Graphics")
              payload_root=incoming/cansips
              if [ -d "$payload_root/pages-payload" ]; then
                payload_root="$payload_root/pages-payload"
              elif [ -d "$payload_root/.pages-payload" ]; then
                payload_root="$payload_root/.pages-payload"
              fi
              test -f "$payload_root/cansips_manifest.json"
              mkdir -p site/cansips
              cp -R "$payload_root/cansips/." site/cansips/
              cp "$payload_root/cansips_manifest.json" site/cansips_manifest.json
              if [ -d "$payload_root/common_reference" ]; then
                mkdir -p site/common_reference
                cp -R "$payload_root/common_reference/." site/common_reference/
              fi
              ;;
            "C3S Multi-System Seasonal Graphics")
              payload_root=incoming/c3s
              if [ -d "$payload_root/pages-payload" ]; then
                payload_root="$payload_root/pages-payload"
              elif [ -d "$payload_root/.pages-payload" ]; then
                payload_root="$payload_root/.pages-payload"
              fi
              test -f "$payload_root/c3s_manifest.json"
              mkdir -p site/c3s
              cp -R "$payload_root/c3s/." site/c3s/
              cp "$payload_root/c3s_manifest.json" site/c3s_manifest.json
              ;;
            "CMA CPSv3 Seasonal Graphics")
              payload_root=incoming/cma_cpsv3
              if [ -d "$payload_root/pages-payload" ]; then
                payload_root="$payload_root/pages-payload"
              elif [ -d "$payload_root/.pages-payload" ]; then
                payload_root="$payload_root/.pages-payload"
              fi
              test -f "$payload_root/cma_cpsv3_manifest.json"
              mkdir -p site/cma_cpsv3
              cp -R "$payload_root/cma_cpsv3/." site/cma_cpsv3/
              cp "$payload_root/cma_cpsv3_manifest.json" site/cma_cpsv3_manifest.json
              ;;
            "JMA Seasonal Graphics")
              payload_root=incoming/jma
              if [ -d "$payload_root/pages-payload" ]; then
                payload_root="$payload_root/pages-payload"
              elif [ -d "$payload_root/.pages-payload" ]; then
                payload_root="$payload_root/.pages-payload"
              fi
              test -f "$payload_root/jma_manifest.json"
              mkdir -p site/jma
              cp -R "$payload_root/jma/." site/jma/
              cp "$payload_root/jma_manifest.json" site/jma_manifest.json
              ;;
            "APCC MME Seasonal Graphics")
              payload_root=incoming/apcc
              if [ -d "$payload_root/pages-payload" ]; then
                payload_root="$payload_root/pages-payload"
              elif [ -d "$payload_root/.pages-payload" ]; then
                payload_root="$payload_root/.pages-payload"
              fi
              test -f "$payload_root/apcc_manifest.json"
              mkdir -p site/apcc
              cp -R "$payload_root/apcc/." site/apcc/
              cp "$payload_root/apcc_manifest.json" site/apcc_manifest.json
              ;;
            "NASA GEOS-S2S-3 Seasonal Graphics")
              payload_root=incoming/geos_s2s3
              if [ -d "$payload_root/pages-payload" ]; then
                payload_root="$payload_root/pages-payload"
              elif [ -d "$payload_root/.pages-payload" ]; then
                payload_root="$payload_root/.pages-payload"
              fi
              test -f "$payload_root/geos_s2s3_manifest.json"
              mkdir -p site/geos_s2s3
              cp -R "$payload_root/geos_s2s3/." site/geos_s2s3/
              cp "$payload_root/geos_s2s3_manifest.json" site/geos_s2s3_manifest.json
              ;;
            "NOAA NMME Seasonal Graphics")
              payload_root=incoming/nmme
              if [ -d "$payload_root/pages-payload" ]; then
                payload_root="$payload_root/pages-payload"
              elif [ -d "$payload_root/.pages-payload" ]; then
                payload_root="$payload_root/.pages-payload"
              fi
              test -f "$payload_root/nmme_manifest.json"
              # Overlay the new payload so images referenced by retained run
              # history survive targeted/manual product repairs.
              mkdir -p site/nmme
              cp -R "$payload_root/nmme/." site/nmme/
              cp "$payload_root/nmme_manifest.json" site/nmme_manifest.json
              ;;
            "Deduplicated Seasonal Super Ensemble")
              payload_root=incoming/superensemble
              if [ -d "$payload_root/pages-payload" ]; then
                payload_root="$payload_root/pages-payload"
              elif [ -d "$payload_root/.pages-payload" ]; then
                payload_root="$payload_root/.pages-payload"
              fi
              test -f "$payload_root/superensemble_manifest.json"
              mkdir -p site/superensemble
              cp -R "$payload_root/superensemble/." site/superensemble/
              cp "$payload_root/superensemble_manifest.json" site/superensemble_manifest.json
              ;;
            "Seasonal 500-mb Pattern Analogs")
              payload_root=incoming/analogs
              if [ -d "$payload_root/pages-payload" ]; then
                payload_root="$payload_root/pages-payload"
              elif [ -d "$payload_root/.pages-payload" ]; then
                payload_root="$payload_root/.pages-payload"
              fi
              analog_root="$payload_root"
              if [ -d "$payload_root/seasonal" ]; then
                # Accept one legacy analog artifact during the migration.
                analog_root="$payload_root/seasonal"
              fi
              test -f "$analog_root/analog_z500_manifest.json"
              test -f "$analog_root/analog_products_manifest.json"
              test -d "$analog_root/analog_products"
              cp "$analog_root/analog_z500_manifest.json" site/analog_z500_manifest.json
              cp "$analog_root/analog_products_manifest.json" site/analog_products_manifest.json
              mkdir -p site/analog_products
              cp -R "$analog_root/analog_products/." site/analog_products/
              ;;
            *)
              echo "Unsupported workflow_run source: $SOURCE_WORKFLOW" >&2
              exit 1
              ;;
          esac

          # Apply reviewed static pages after model payloads so they survive refreshes.
          mkdir -p site/cfsv2/native-snowfall
          cp -R dashboard-source/public/seasonal/cfsv2/native-snowfall/. site/cfsv2/native-snowfall/

          rm -rf site/.git

      - name: Validate reviewed native snowfall snapshot
        run: python dashboard-source/scripts/validate_native_snow_snapshot.py --site-root site

      - name: Remove retired seasonal products
        run: python dashboard-source/scripts/purge_retired_seasonal_products.py --site-root site

      - name: Validate seasonal manifests and build catalog
        run: |
          python dashboard-source/scripts/build_seasonal_catalog.py \
            --site-root site \
            --strict \
            --source-revision "${GITHUB_SHA}"

      - name: Build wall.cloud share images
        run: python dashboard-source/scripts/build_seasonal_share_images.py --site-root site --strict

      - name: Build seasonal Compare thumbnails
        run: python dashboard-source/scripts/build_seasonal_thumbnails.py --site-root site --max-width 560 --quality 82

      - name: Publish the merged Pages tree
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          keep_files: false
          force_orphan: false
          enable_jekyll: false

