name: Cancel stale style refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cancel-stale-style.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Force-cancel stale 500-mb maintenance run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/actions/runs/34375963944/force-cancel"
