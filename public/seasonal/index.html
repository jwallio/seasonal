<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seasonal Model Dashboard</title>
  <meta name="description" content="Operational seasonal model dashboard for CFSv2, ECMWF SEAS5, CanSIPS v3, C3S, and NOAA NMME guidance.">
  <style>
    :root { color-scheme: dark; --ink:#f3f7f9; --muted:#a9bac3; --panel:#10232d; --line:#2b4855; --teal:#59d4c0; --coral:#ff927c; --blue:#75b8e8; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 15% 0%,#1a3d4b 0,transparent 34rem),#08141b; color:var(--ink); font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    a { color:var(--teal); }
    .shell { width:min(1440px,calc(100% - 32px)); margin:0 auto; padding:18px 0 52px; }
    h1 { margin:0; font-size:clamp(30px,5vw,54px); line-height:1; letter-spacing:-.045em; }
    .hero { padding-bottom:14px; }
    .card { background:linear-gradient(145deg,#132c37e8,#0c1d25e8); border:1px solid var(--line); border-radius:22px; box-shadow:0 18px 60px #0005; overflow:hidden; }
    .view-tabs { display:flex; gap:8px; margin:0 0 12px; }
    .view-tabs button { border-radius:10px; padding:9px 14px; color:var(--muted); }
    .view-tabs button.active { border-color:var(--teal); background:#173c45; color:var(--ink); }
    .compare-view[hidden], #single-toolbar[hidden], #single-view[hidden] { display:none; }
    .toolbar { display:grid; grid-template-columns:minmax(180px,.9fr) minmax(230px,1.3fr) minmax(260px,1.5fr); gap:12px; padding:16px; margin-bottom:18px; }
    .selector { display:grid; gap:5px; }
    .selector label, .control-label { color:var(--muted); font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
    select { width:100%; border:1px solid var(--line); border-radius:10px; background:#0d2029; color:var(--ink); cursor:pointer; padding:10px 11px; font:inherit; font-size:13px; }
    select:focus { outline:2px solid var(--teal); outline-offset:1px; }
    select:disabled { cursor:wait; opacity:.65; }
    .grid { display:grid; grid-template-columns:minmax(0,1.55fr) minmax(310px,.72fr); gap:18px; }
    .card-head { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 20px; border-bottom:1px solid var(--line); }
    .card-head h2 { margin:0; font-size:16px; letter-spacing:.01em; }
    .viewer { padding:16px; }
    .map-wrap { min-height:520px; display:grid; place-items:center; background:#dfeaf0; border:1px solid #486774; border-radius:15px; overflow:hidden; }
    .map-wrap img { display:block; width:100%; height:auto; max-height:760px; object-fit:contain; }
    .empty { padding:64px 24px; color:#24404b; text-align:center; }
    .controls { display:flex; align-items:center; flex-wrap:wrap; gap:8px; padding:0 16px 16px; }
    button { appearance:none; border:1px solid var(--line); border-radius:999px; background:#0d2029; color:var(--muted); cursor:pointer; padding:8px 12px; font:inherit; font-size:12px; }
    button:hover,button.active { border-color:var(--teal); background:#173c45; color:var(--ink); }
    .ratio-control { display:flex; align-items:center; gap:8px; margin-left:auto; min-width:150px; }
    .ratio-control[hidden] { display:none; }
    .ratio-control select { width:auto; min-width:88px; padding:7px 9px; }
    .warning { display:none; margin:0 16px 16px; padding:12px 14px; border:1px solid #ff927c66; border-radius:12px; color:#ffd0c7; background:#43282066; font-size:13px; }
    .side { display:grid; gap:18px; align-content:start; }
    .facts { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:16px; }
    .fact { min-height:76px; padding:12px; background:#0b1b23; border:1px solid #24414d; border-radius:14px; }
    .fact small { display:block; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
    .fact strong { display:block; margin-top:5px; font-size:16px; overflow-wrap:anywhere; }
    .copy { padding:17px 20px 20px; color:var(--muted); }
    .copy p { margin:0 0 12px; }
    .copy p:last-child { margin-bottom:0; }
    .links { display:flex; flex-wrap:wrap; gap:12px; padding:0 20px 20px; font-size:13px; }
    .compare-toolbar { display:flex; align-items:end; flex-wrap:wrap; gap:14px; padding:14px 16px; margin-bottom:18px; }
    .compare-toolbar .selector { width:min(320px,100%); }
    .compare-summary { margin:0 0 2px auto; color:var(--muted); font-size:12px; }
    .compare-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
    .compare-card { min-width:0; }
    .compare-card-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 15px; border-bottom:1px solid var(--line); }
    .compare-card-head h2 { margin:0; font-size:15px; }
    .compare-card-head a { font-size:11px; white-space:nowrap; }
    .compare-image-wrap { display:grid; place-items:center; min-height:230px; margin:12px; background:#dfeaf0; border:1px solid #486774; border-radius:12px; overflow:hidden; }
    .compare-image-wrap img { display:block; width:100%; height:auto; }
    .compare-image-wrap .empty { width:100%; padding:42px 18px; }
    .compare-meta { margin:0; padding:0 14px 14px; color:var(--muted); font-size:11px; line-height:1.45; }
    .footer { margin-top:20px; color:#8298a3; font-size:12px; }
    @media (max-width:1280px) { .compare-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
    @media (max-width:900px) { .toolbar{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.grid{grid-template-columns:1fr} }
    @media (max-width:600px) { .shell{width:min(100% - 20px,1440px);padding-top:12px}.toolbar{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.toolbar .selector:nth-child(3){grid-column:1 / -1}.map-wrap{min-height:280px}.card-head{padding:15px}.viewer{padding:10px}.controls{padding:0 10px 12px}.ratio-control{margin-left:0}.facts{padding:10px}.links{padding:0 15px 15px} }
    @media (max-width:600px) { .compare-grid{grid-template-columns:1fr}.compare-toolbar{align-items:stretch}.compare-summary{width:100%;margin:0}.compare-image-wrap{margin:10px}.view-tabs{margin-bottom:10px} }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <h1>Seasonal Model Dashboard</h1>
    </header>

    <nav class="view-tabs" aria-label="Dashboard view">
      <button id="single-tab" type="button" class="active" aria-selected="true">Single model</button>
      <button id="compare-tab" type="button" aria-selected="false">Compare</button>
    </nav>

    <section class="toolbar card" id="single-toolbar" aria-label="Dashboard selectors">
      <div class="selector"><label for="model-select">Model</label><select id="model-select"></select></div>
      <div class="selector"><label for="product-select">Parameter</label><select id="product-select" disabled><option>Loading…</option></select></div>
      <div class="selector"><label for="run-select">Run history</label><select id="run-select" disabled><option>Loading…</option></select></div>
    </section>

    <section class="grid" id="single-view">
      <article class="card">
        <div class="viewer"><div class="map-wrap" id="map-wrap"><div class="empty">Reading the latest published run.</div></div></div>
        <div class="controls" id="target-controls"></div>
        <div class="warning" id="warning"></div>
      </article>

      <aside class="side">
        <article class="card">
          <div class="card-head"><h2>Forecast readout</h2></div>
          <div class="facts">
            <div class="fact"><small>Model</small><strong id="fact-model">—</strong></div>
            <div class="fact"><small>Valid period</small><strong id="fact-target">—</strong></div>
            <div class="fact"><small>Lead / hour</small><strong id="fact-lead">—</strong></div>
            <div class="fact"><small>Ensemb
